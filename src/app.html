@media (max-height:480px) and (orientation:landscape){ .courts{grid-template-columns:1fr 1fr;gap:6px} .board{position:sticky;top:40px;padding:4px 10px;margin-bottom:6px} .board .tm .sc{font-size:30px} .board .clock{font-size:24px} .board .cbtns button{padding:4px 8px;font-size:12px} .board .undo{padding:4px 10px;font-size:12px} .board .meta{display:none} .prow .pbtn{min-height:44px} .qb{min-height:44px} .top{padding:4px 12px} .top img{height:28px} .top .brand{font-size:16px} .top .brand small{display:none} .astbar{bottom:8px} .toast{left:auto;right:12px;transform:none;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 8px);font-size:13px;padding:6px 12px} }
@media (max-width:480px){ .courts{grid-template-columns:1fr;gap:4px} .court+.court{margin-top:8px} .court h3{margin:4px 0 6px} .prow .pbtn{min-height:50px;padding:8px 10px} .qb{width:52px;font-size:18px;min-height:50px} .board{padding:10px 12px} .board .tm .sc{font-size:44px;line-height:1} .board .clock{font-size:34px} .board .meta{display:none} .board .cbtns button{padding:6px 10px;font-size:13px} }
@media (max-width:420px){ .board .tm .sc{font-size:42px} .pbtn{padding:8px 6px;min-height:50px}.qb{width:40px;font-size:15px;border-radius:8px}.prow{gap:4px}.pbtn .nm{font-size:14px} .pbtn .st{display:none} }
@media (prefers-reduced-motion:no-preference){ #main,#overlay{touch-action:manipulation}
#main.enter>*{animation:fadein .16s ease-out} @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} .lead,.chip,.btn,.pbtn,.qb,.tabs button{transition:transform .08s ease,background .15s ease,opacity .15s ease} .lead:active,.chip:active,.btn:active{transform:scale(.985)} .tile{transition:transform .15s ease} .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(30px);opacity:0}} }

// ---------- demo data (in memory only, never saved) ----------
const DEMO={players:{},sessions:{}};
function buildDemo(){
  const names=['Yannick','Serge','Franck','Patrick','Cédric','Hervé','Landry','Steve','Christian','Rodrigue','Boris','Arnaud','Jean-Marc','Thierry','Éric','Olivier','Didier','Ludovic','Alain','Joël','Fabrice'];
  names.forEach((n,i)=>DEMO.players['d'+i]={id:'d'+i,name:n+' (démo)',member:i<12,active:true});
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  ['2026-09-06','2026-09-13','2026-09-20','2026-09-27'].forEach((date,si)=>{
    const ids=Object.keys(DEMO.players).sort(()=>rnd()-.5).slice(0,21);
    const teams={A:{name:'Orange',players:ids.slice(0,7)},B:{name:'Bleu',players:ids.slice(7,14)},C:{name:'Vert',players:ids.slice(14,21)}};
    const matches=[]; let home='A',away='B',wait='C';
    for(let n=1;n<=12;n++){
      const m={n,home,away,lineup:{[home]:teams[home].players.slice(0,5),[away]:teams[away].players.slice(0,5)},events:[],status:'done',elapsedMs:600000,running:false};
      const sc={[home]:0,[away]:0}; let t=0;
      while(sc[home]<12&&sc[away]<12&&t<40){ t++; const team=rnd()<.5?home:away; const pid=teams[team].players[Math.floor(rnd()*5)]; const r=rnd();
        if(r<.62){ m.events.push({t,type:'pt',team,pid,v:2}); sc[team]+=2; } else if(r<.8){ m.events.push({t,type:'pt',team,pid,v:3}); sc[team]+=3; }
        else if(r<.9){ m.events.push({t,type:'foul',team,pid}); const o=team===home?away:home; const sh=teams[o].players[Math.floor(rnd()*5)]; if(rnd()<.4){ const made=rnd()<.65; m.events.push({t,type:'ft',team:o,pid:sh,made}); if(made)sc[o]++; } }
        else if(r<.93){ m.events.push({t,type:'tech',team,pid}); } else if(r<.95){ m.events.push({t,type:'uns',team,pid}); }
        else { const on=m.lineup[team]; const bench=teams[team].players.filter(p=>!on.includes(p)); if(bench.length){ m.events.push({t,type:'sub',team,out:on[Math.floor(rnd()*5)],in:bench[Math.floor(rnd()*bench.length)]}); } } }
      m.winner = sc[home]>=sc[away]? home: away; m.endReason = sc[home]>=12||sc[away]>=12?'points':'time';
      matches.push(m); const loser=m.winner===home?away:home; home=m.winner; away=wait; wait=loser;
    }
    DEMO.sessions['s'+si]={id:'s'+si,date,teams,matches,status:'closed',createdAt:0};
  });
}
function setDemo(on){ S.demo=on; if(on){ if(!Object.keys(DEMO.players).length) buildDemo(); S._real={players:S.players,sessions:S.sessions,sid:S.sid,sanctions:S.sanctions}; S.players=DEMO.players; S.sessions=DEMO.sessions; S.sanctions={}; S.sid='s3'; S.view='stats'; }

function normName(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function playerKeys(p){ return [p.name,p.nick,...(p.aliases||[])].filter(Boolean).map(normName).filter(Boolean); }
function levName(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const m=[]; for(let i=0;i<=a.length;i++) m[i]=[i]; for(let j=1;j<=b.length;j++) m[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
function similarPlayers(name,excludeId){ const n=normName(name); if(!n) return []; const ft=n.split(' ')[0]; return Object.values(S.players).filter(p=>p.id!==excludeId&&p.active!==false).filter(p=>playerKeys(p).some(k=>k===n||k.split(' ')[0]===ft||(n.length>=5&&levName(k,n)<=2))).map(p=>p.id); }

function matchPasteName(name){ const n=normName(name); if(!n) return {kind:'empty'}; const act=Object.values(S.players).filter(p=>p.active!==false);
  const exact=act.filter(p=>playerKeys(p).includes(n)); if(exact.length===1) return {kind:'ok',pid:exact[0].id}; if(exact.length>1) return {kind:'ambiguous',cands:exact.map(p=>p.id)};

  if(byFirst.length>1){ if(toks[1]){ const ini=toks[1][0]; const c2=byFirst.filter(p=>playerKeys(p).some(k=>{ const t=k.split(' '); return t[0]===ft&&t[1]&&t[1][0]===ini; })); if(c2.length===1) return {kind:'ok',pid:c2[0].id,loose:true}; } return {kind:'ambiguous',cands:byFirst.map(p=>p.id)}; }

  return {kind:'unknown',cands:sub.map(p=>p.id)}; }
function parsePasteList(text){ const seen=new Set(); return String(text||'').split(/\r?\n/).map(raw=>({raw:raw.trim(),name:parsePasteLine(raw)})).filter(x=>x.raw).map(x=>{ const r={...x,...matchPasteName(x.name)}; if(r.kind==='ok'){ if(seen.has(r.pid)) r.kind='dup'; seen.add(r.pid); } return r; }); }

    ${(()=>{ const b=seasonBounds(); const ss=Object.values(S.sessions).filter(s=>s.status!=='setup'&&!s.excluded&&s.date>=b.start&&s.date<b.end); const nb=nbaComparisons(ss,sh.pid,'season'); const ctx=playerContext(ss,sh.pid); if(!nb.length) return ctx.gp?`<p class="muted small">Clin d'œil NBA disponible à partir de 12 matchs dans la saison (${ctx.gp} joué${ctx.gp>1?'s':''}).</p>`:''; return `<h3 style="margin:8px 0 4px">Clin d'œil NBA <span class="muted" style="text-transform:none;letter-spacing:0">(saison, ${ctx.gp} matchs)</span></h3>${nb.map(l=>`<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)">${l.text}</div>`).join('')}${att.length?(()=>{ const last=att[0]; const d=nbaComparisons([last],sh.pid,'day'); return d.length?`<p class="muted small" style="margin-top:6px">Dernière séance (${esc(fmtShort(last.date))}) : ${d.slice(0,2).map(l=>l.plain).join(' · ')}</p>`:''; })():''}`; })()}
    ${(()=>{ const bl=badgesForPlayer(sh.pid); if(!bl.length) return ''; const cnt={}; bl.forEach(b=>cnt[b.key]=(cnt[b.key]||0)+1); return `<h3 style="margin:8px 0 4px">Badges <span class="muted" style="text-transform:none;letter-spacing:0">(${bl.length})</span></h3><div class="row" style="gap:6px">${Object.entries(cnt).map(([k,n])=>`<span class="pill">${BADGES[k][0]} ${BADGES[k][1]}${n>1?' ×'+n:''}</span>`).join('')}</div><p class="muted small" style="margin:4px 0 0">Dernier : ${esc(bl[bl.length-1].label)} le ${esc(fmtShort(bl[bl.length-1].date))} (${esc(bl[bl.length-1].detail)})</p>`; })()}
    ${perf.length>=2?`<h3 style="margin:8px 0 2px">Points par séance</h3>${sparkline([...perf].reverse().map(x=>x.r.pts))}<div class="row small muted" style="justify-content:space-between"><span>${esc(fmtShort(perf[perf.length-1].s.date))}</span><span>${esc(fmtShort(perf[0].s.date))}</span></div>`:''}
    `:''}

    ${best&&best.r.pts?`<p class="small">🔥 Meilleure perf : <b>${best.r.pts} pts</b> le ${esc(fmtDate(best.s.date))}</p>`:''}

    ${perf.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Équipe</th><th>Pts</th><th>PD</th><th>V-D</th><th>3 pts</th><th>+/-</th><th>T/AS</th></tr></thead><tbody>${perf.map(x=>`<tr><td class="name">${esc(fmtShort(x.s.date))}</td><td class="num">${x.ts.length?x.ts.map(t=>`${dot(x.s.teams,t)} ${esc(x.s.teams[t].name||TNAMES[t])}`).join(' / '):'–'}</td><td class="num">${x.r.pts}</td><td class="num">${x.r.ast||0}</td><td class="num">${x.r.w}-${x.r.gp-x.r.w}</td><td class="num">${x.r.fg3}</td><td class="num">${x.r.pm>0?'+':''}${x.r.pm}</td><td class="num">${x.r.tech}/${x.r.uns}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">Aucune séance jouée.</p>'}
    <h3 style="margin:14px 0 6px">Sanctions <span class="muted" style="text-transform:none;letter-spacing:0">(${sq.all.length} cette saison, ${sq.grave} grave${sq.grave>1?'s':''})</span></h3>
    ${playerSanctions(sh.pid,false).map(x=>`<div class="lead"><div class="ico"><span class="tag ${x.cat}">${x.cat}</span></div><div><div class="who">${esc(fmtShort(x.date))} · ${esc(x.type)}</div><div class="what">${esc(x.sanction||'')}${x.until?' · jusqu\'au '+esc(fmtShort(x.until)):''}${x.fine?(x.finePaid?' · 🍺 amende réglée'+(x.fineMode==='virement'?' (virement)':' (carafe)')+(x.finePaidAt?' le '+esc(fmtShort(x.finePaidAt)):''):' · <b style="color:var(--bad)">🍺 amende à régler (carafe ou '+(S.config.fineAmount||45)+' €)</b>'):''}${x.note?' · '+esc(x.note):''}</div></div>${rw&&x.fine&&!x.finePaid?`<button class="btn sm primary" data-act="fine-paid" data-id="${x.id}" data-mode="carafe">Carafe reçue</button><button class="btn sm navy" data-act="fine-paid" data-id="${x.id}" data-mode="virement">Virement reçu</button>`:''}${rw?`<button class="btn sm ghost" data-act="edit-sanction" data-id="${x.id}">✎</button>`:''}</div>`).join('')||'<p class="muted small">Aucune sanction.</p>'}

${close}</div></div>`; }
  if(sh.type==='sanction'){ const x=sh.sid?{...S.sanctions[sh.sid],...(sh.draft||{})}:(sh.draft||{pid:sh.pid||'',date:today(),cat:'B',type:BAREME[0].type,sanction:'',until:'',note:'',fine:true,finePaid:false}); const list=Object.values(S.players).filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    const nth = x.pid? (playerSanctions(x.pid,true).filter(y=>y.type===x.type&&y.id!==x.id&&y.date<=x.date).length+1) : 1; const b=BAREME.find(b=>b.type===x.type); const sugg=b?b.esc[Math.min(nth,3)-1]:'';
    return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>${sh.sid?'Modifier la sanction':'Nouvelle sanction'}</h2>
    <label class="small muted">Joueur</label><select id="snPid" style="margin-bottom:8px"><option value="">—</option>${list.map(p=>`<option value="${p.id}" ${p.id===x.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <div class="row" style="margin-bottom:8px"><div class="grow"><label class="small muted">Date des faits</label><input type="date" id="snDate" value="${esc(x.date)}"></div></div>
    <label class="small muted">Faute (barème)</label><select id="snType" style="margin-bottom:8px">${BAREME.map(b=>`<option value="${esc(b.type)}" ${b.type===x.type?'selected':''}>${b.cat} · ${esc(b.type)}</option>`).join('')}</select>
    ${x.pid?`<div class="alert warn">${nth}${nth===1?'re':'e'} fois cette saison pour cette faute. Barème : <b>${esc(sugg)}</b></div>`:''}
    <label class="small muted">Sanction décidée par le bureau</label><input id="snSanction" value="${esc(x.sanction||sugg)}" placeholder="ex. 2 séances" style="margin-bottom:8px">
    <div class="row" style="margin-bottom:8px"><div class="grow"><label class="small muted">Suspendu jusqu'au (inclus)</label><input type="date" id="snUntil" value="${esc(x.until||'')}"></div></div>
    <label class="row small" style="margin-bottom:6px"><input type="checkbox" id="snFine" ${x.fine?'checked':''} style="width:auto"> Amende due (carafe ou ${S.config.fineAmount||45} € au compte de l'association) — bloque l'inscription tant qu'elle n'est pas réglée</label>
    <div class="row" style="margin-bottom:8px"><label class="row small"><input type="checkbox" id="snFinePaid" ${x.finePaid?'checked':''} style="width:auto"> Réglée</label><select id="snFineMode" style="max-width:220px"><option value="carafe" ${x.fineMode==='carafe'?'selected':''}>Carafe sur place</option><option value="virement" ${x.fineMode==='virement'?'selected':''}>${S.config.fineAmount||45} € par virement</option></select></div>
    <label class="small muted">Note</label><input id="snNote" value="${esc(x.note||'')}" placeholder="Contexte, décision, excuses…" style="margin-bottom:8px">
    <div class="row"><button class="btn primary grow" data-act="save-sanction">Enregistrer</button>${sh.sid?`<button class="btn ghost sm" data-act="delete-sanction">Supprimer</button>`:''}</div>${close}</div></div>`; }
  if(sh.type==='incident'){ const list=Object.values(S.players).filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'fr')); const sx=curSession(); const mx=sx&&liveMatch(sx);
    return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>🚩 Signaler un incident</h2><p class="muted small">Le signalement est daté et transmis au bureau, qui décide de la sanction. Rien n'est sanctionné automatiquement.</p>
    <label class="small muted">Joueur</label><select id="inPid" style="margin-bottom:8px">${list.map(p=>`<option value="${p.id}" ${p.id===sh.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label class="small muted">Nature</label><div class="chips" style="margin-bottom:8px">${INCIDENTS.map(([k,l])=>`<button class="chip ${(sh.kind||'contestation')===k?'on':''}" data-act="incident-kind" data-id="${k}">${l}</button>`).join('')}</div>
    <label class="small muted">Précisions (facultatif)</label><input id="inNote" placeholder="ex. a refusé de reprendre le jeu, a insulté l'arbitre…" value="${esc(sh.note||'')}" style="margin-bottom:8px">
    <p class="muted small">${sx?esc(fmtDate(sx.date)):''}${mx?' · match '+mx.n:''}</p>
    <button class="btn danger" style="width:100%" data-act="incident-save">Enregistrer le signalement</button>${close}</div></div>`; }
  if(sh.type==='opening'){ const o=(S.treasury.ledger&&S.treasury.ledger.opening)||{date:seasonBounds().start,amt:0}; return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>Solde de départ</h2><p class="muted small">Le solde du compte à une date de référence (relevé bancaire, fin de journée). Seuls les cotisations marquées « reçues », les participations de séances et les mouvements <b>datés après</b> cette date s'ajoutent ou se retirent : ce qui est antérieur est déjà dans le solde. Le plus simple : le solde au 31 août, avant la première cotisation de la saison.</p><div class="grid2"><div><label class="small muted">Date</label><input id="opDate" type="date" value="${esc(o.date)}"></div><div><label class="small muted">Solde (€)</label><input id="opAmt" inputmode="decimal" value="${o.amt||''}"></div></div><button class="btn primary" style="width:100%;margin-top:12px" data-act="opening-save">Enregistrer</button>${close}</div></div>`; }
  if(sh.type==='budget'){ const bb=S.treasury.budget||{}; return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>Enveloppes de fin de saison</h2><p class="muted small">Montants décidés par le bureau au moment de l'organisation. Le BBQ a tourné autour de 1 500 € au total sur les trois premières éditions, caisse + participations des membres.</p><label class="small muted">Budget BBQ total (€)</label><input id="bbBbq" inputmode="decimal" value="${bb.bbq!=null?bb.bbq:1500}" style="margin-bottom:8px"><label class="small muted">Dont participation demandée aux membres (€, total)</label><input id="bbMem" inputmode="decimal" value="${bb.bbqMembers||''}" placeholder="0" style="margin-bottom:8px"><label class="small muted">Matériel prévu (€)</label><input id="bbEq" inputmode="decimal" value="${bb.equip||''}" placeholder="0" style="margin-bottom:8px"><p class="muted small">Le reste de l'excédent va au pack de la saison suivante.</p><button class="btn primary" style="width:100%;margin-top:12px" data-act="budget-save">Enregistrer</button>${close}</div></div>`; }
  if(sh.type==='pack'){ const pk=pack(); return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>Le pack d'heures</h2>

  if(sh.type==='import'){ return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>Importer des joueurs</h2><p class="muted small">Un nom par ligne. Ajoutez « * » à la fin pour marquer un adhérent. Les noms déjà présents sont ignorés.</p><textarea id="impTxt" placeholder="Yannick *&#10;Serge&#10;Franck *"></textarea><button class="btn primary" style="width:100%;margin-top:8px" data-act="import-confirm">Importer</button>${close}</div></div>`; }
  if(sh.type==='scorer'){ const L=sh.links; return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>🔗 Lien marqueur</h2><p class="muted small">La personne qui ouvre ce lien voit uniquement la table de marque de cette séance${(()=>{ const sx0=S.sessions[sh.sid]; return sx0&&sx0.date>today()?' et peut saisir jusqu\'au '+esc(fmtShort(sx0.date))+' 23h59. Créé la veille, le lien permet au marqueur de pointer les présents, former les équipes et lancer la séance sans le bureau':' et peut saisir jusqu\'à ce soir 23h59'; })()}. Pas de compte nécessaire. Désactivez un lien à tout moment. Conseil au marqueur : ouvrir le lien dans Chrome ou Safari (pas dans la fenêtre WhatsApp), taper 🔊 une fois pour activer le buzzer, et laisser l'écran allumé.</p>
    ${sh.newUrl?`<div class="demo" style="word-break:break-all"><b>Nouveau lien :</b><br>${esc(sh.newUrl)}<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="scorer-copy" data-url="${esc(sh.newUrl)}">Partager / copier</button></div></div>`:''}
    <div class="row" style="margin:8px 0"><input id="scLabel" placeholder="Pour qui ? (ex. Karen)" class="grow"><button class="btn navy" data-act="scorer-create">Créer un lien</button></div>
    ${L===null?'<p class="muted small">Chargement…</p>':L.length?`<p class="small muted"><b>Liens actifs</b></p>`+L.map(l=>{ const exp=l.expires&&l.expires.toDate?l.expires.toDate():null; const url=location.origin+location.pathname+'?marqueur='+l.token+'&seance='+encodeURIComponent(l.sid); return `<div class="row" style="margin:4px 0;gap:6px"><span class="small grow">${esc(l.label||'sans nom')} · ${exp?'jusqu\'au '+exp.toLocaleDateString('fr-FR',{day:'numeric',month:'short',timeZone:'Europe/Paris'})+' '+exp.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}):''}</span><button class="btn sm ghost" data-act="scorer-copy" data-url="${esc(url)}">Copier</button><button class="btn sm ghost" style="color:var(--bad)" data-act="scorer-revoke" data-id="${l.token}">Désactiver</button></div>`; }).join(''):'<p class="muted small">Aucun lien actif.</p>'}
    <button class="btn ghost" style="width:100%;margin-top:10px" data-act="sheet-close">Fermer</button></div></div>`; }
  if(sh.type==='fixres'){ const s=S.sessions[sh.sid]; if(!s) return ''; const tn=t=>s.teams[t]&&(s.teams[t].name||TNAMES[t]); const Ts=TEAMS.filter(t=>s.teams[t]&&s.teams[t].players.length); const done=s.matches.filter(x=>x.status==='done');

    <label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="fxApprox" ${s.teamsApprox?'checked':''} style="width:auto"> Classement du jour approximatif (affiche une mention au lieu du trophée)</label><input id="fxNote" placeholder="Note affichée (ex. : trois équipes à égalité, léger avantage Gris)" value="${esc(s.resultNote||'')}" style="margin-top:6px">
    <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="fix-save">Enregistrer la note</button><button class="btn ghost" data-act="sheet-close">Fermer</button></div></div></div>`; }
  if(sh.type==='five'){ const m=liveMatch(s); if(!m||m.events.length){ S.sheet=null; return ''; } const tn=t=>s.teams[t].name||TNAMES[t]; const col=t=>{ const all=(m.roster&&m.roster[t===m.home?'home':'away'])||s.teams[t].players; const on=m.lineup[t]||[]; const cap=Math.min(5,all.length); return `<div><h3 style="margin:8px 0 4px">${dot(s.teams,t)} ${esc(tn(t))} <span class="muted small">${on.length}/${cap} sur le terrain</span></h3><div class="chips">${all.map(pid=>`<button class="chip ${on.includes(pid)?'on':''}" data-act="five-toggle" data-team="${t}" data-id="${pid}">${esc(pshort(pid))}</button>`).join('')}</div></div>`; };
    return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>🖐 Cinq de départ · match ${m.n}</h2><p class="muted small">Tapez les joueurs qui commencent (5 par équipe). Les autres sont sur le banc et entreront par remplacement. C'est ce qui rend justes les matchs joués, le temps de jeu et l'impact.</p>${col(m.home)}${col(m.away)}<button class="btn primary" style="width:100%;margin-top:14px" data-act="five-ok">C'est parti</button></div></div>`; }
  if(sh.type==='editteams'){ const st=S.setup; return `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-stop="1"><h2>Équipes</h2><p class="muted small">Tapez un joueur pour changer son équipe. Chaque mouvement est daté et consigné.</p>
    <div class="row" style="margin-bottom:8px"><input id="lateName" placeholder="Ajouter un retardataire…" class="grow"><button class="btn sm navy" data-act="late-add">+</button></div>
    <div class="row" style="margin-bottom:8px"><label class="small muted">Motif</label><select id="chgReason" class="grow"><option value="rééquilibrage">Rééquilibrage des équipes</option><option value="blessure">Blessure</option><option value="départ">Joueur parti</option><option value="retardataire">Retardataire</option><option value="">Autre</option></select></div>
    <p class="muted small">Pour retirer un joueur (parti, blessé), tapez-le jusqu'à ce qu'il n'ait plus de couleur. Ses stats des matchs déjà joués sont conservées.</p>
    <div class="chips">${st.present.map(id=>{ const t=TEAMS.find(t=>st.teams[t].players.includes(id)); const cap=t&&st.teams[t].captain===id; return `<button class="chip ${t?'team':''}" style="${t?'--tc:'+tcol(st.teams,t):''}" data-act="cycle-team" data-id="${id}">${t?dot(st.teams,t):''}${cap?'© ':''}${esc(pname(id))}</button>`; }).join('')}</div>
    <p class="muted small" style="margin-top:8px"><b>Capitaines</b> (responsables de leur équipe)</p>${TEAMS.filter(t=>st.teams[t]&&st.teams[t].players.length).map(t=>`<div class="row" style="margin-bottom:6px">${dot(st.teams,t)}<span class="small" style="min-width:70px">${esc(st.teams[t].name)}</span><select data-team-cap="${t}" class="grow"><option value="">— capitaine —</option>${st.teams[t].players.map(id=>`<option value="${id}" ${st.teams[t].captain===id?'selected':''}>${esc(pname(id))}</option>`).join('')}</select></div>`).join('')}
    <button class="btn primary" style="width:100%;margin-top:12px" data-act="editteams-save">Enregistrer</button>${close}</div></div>`; }
  return '';
