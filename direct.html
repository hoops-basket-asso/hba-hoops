.it.dim{opacity:.72}

<script>
'use strict';
// ---------- Le direct : lecture seule de la séance en cours, avec un léger différé ----------
const QS=new URLSearchParams(location.search);
const DELAY=Math.max(0,Math.min(120,+(QS.get('delai')||20)))*1000;   // différé : la table a le temps de corriger avant que ça s'affiche
const SRC=QS.get('src'), REPLAY=QS.has('rejouer')||!!SRC, SPEED=Math.max(1,Math.min(200,+(QS.get('vitesse')||40)));
const CHAS={noir:'#6B7280',gris:'#8E8E93',blanc:'#E9E6DF',vert:'#01A54E',rouge:'#EE312B',jaune:'#FABF25',bleu:'#4156A7',orange:'#E97F4B',violet:'#8B5CF6',sans:'#B8B2A6'}, SLOT={A:'#E8702A',B:'#2F6FD6',C:'#2B9A66',D:'#8B5CF6'};
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D={players:{},sess:null,cfg:{minutes:9,teamFoulLimit:6},offset:null,seen:null,queue:[],busy:false,feed:[],mode:'wait',last:{},vt0:0,rt0:0,endShown:{}};
const tcol=t=>{ const tm=D.sess&&D.sess.teams&&D.sess.teams[t]; return (tm&&CHAS[tm.color])||SLOT[t]||'#888'; };
const tname=t=>{ const tm=D.sess&&D.sess.teams&&D.sess.teams[t]; return (tm&&tm.name)||t; };
const pname=id=>{ const p=D.players[id]; return p?String(p.name||'').replace(/\s*\(.*?\)\s*/g,' ').trim():'Joueur'; };
const pinit=id=>pname(id).split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
const av=(id,c)=>{ const p=D.players[id]; return p&&p.photo?`<img class="av" style="--c:${c}" src="${esc(p.photo)}" alt="">`:`<span class="av" style="--c:${c}">${esc(pinit(id))}</span>`; };
const mmss=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const plural=(n,w)=>n+' '+w+(n>1?'s':'');

// Horloge : en direct, l'heure de la table est estimée à partir du plus petit écart observé ; en rediffusion, une horloge accélérée.
function now(){ if(REPLAY) return D.vt; return Date.now()-(D.offset||0)-DELAY; }
function items(s){ const out=[]; (s.matches||[]).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(m=>{ const id=m.createdAt||m.n; out.push({key:id+':start',k:'start',m,t:m.createdAt||0});
    (m.events||[]).forEach((e,i)=>out.push({key:id+':'+e.type+':'+e.t+':'+(e.pid||e.in||''),k:'ev',m,e,t:e.t||m.createdAt||0,i}));
    if(m.status==='done'&&m.endedAt) out.push({key:id+':end',k:'end',m,t:Math.max(m.endedAt,...(m.events||[]).map(e=>e.t||0))+1}); }); return out.sort((a,b)=>a.t-b.t); }
// État à l'instant affiché : tout est recalculé depuis la séance, donc une correction de la table se répercute toute seule.
function stateAt(s,T){ const st={cur:null,sc:{},tf:{},pl:{},wins:{},played:{},done:0,ended:false,lastEl:0,lastT:0,run:null,mp:{}};
  const P=id=>st.pl[id]||(st.pl[id]={pts:0,ast:0,blk:0,stl:0,pf:0,f3:0,reb:0});
  (s.matches||[]).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(m=>{ if((m.createdAt||0)>T) return; const evs=(m.events||[]).filter(e=>(e.t||0)<=T); const endT=m.status==='done'&&m.endedAt?Math.max(m.endedAt,...(m.events||[]).map(e=>e.t||0))+1:null; const ended=endT!=null&&endT<=T;
    const sc={[m.home]:0,[m.away]:0}, tf={[m.home]:0,[m.away]:0}, mp={}; let run={t:null,n:0}; const lim=D.cfg.teamFoulLimit||6;
    evs.forEach(e=>{ const add=v=>{ sc[e.team]=(sc[e.team]||0)+v; P(e.pid).pts+=v; mp[e.pid]=(mp[e.pid]||0)+v; if(run.t===e.team) run.n+=v; else run={t:e.team,n:v}; };

function pump(){ if(D.busy) return; const it=D.queue.shift(); if(!it){ const idle=$('#idle'); if(idle&&!$('#stage .endc')) idle.style.visibility='visible'; return; }
  const d=describe(it,D.st); if(d.skip||d.merge){ return pump(); }
  // la passe décisive suit le panier dans le journal : on la rattache à l'animation du panier
  if(it.k==='ev'&&it.e.type==='pt'){ const nx=(it.m.events||[])[ (it.m.events||[]).indexOf(it.e)+1 ]; if(nx&&nx.type==='ast'&&nx.team===it.e.team) d.ast=pname(nx.pid); }

const SND={on:false,ctx:null};
function tone(f0,f1,dur,type,vol,when){ const c=SND.ctx, t=c.currentTime+(when||0); const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02); }
function noise(dur,f0,f1,q,vol,when){ const c=SND.ctx, t=c.currentTime+(when||0); const n=Math.floor(c.sampleRate*dur); const buf=c.createBuffer(1,n,c.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; const src=c.createBufferSource(); src.buffer=buf; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1; bp.frequency.setValueAtTime(f0,t); if(f1) bp.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.3,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); src.connect(bp).connect(g).connect(c.destination); src.start(t); }
function sound(k){ if(!SND.on||!SND.ctx) return; try{ if(SND.ctx.state==='suspended') SND.ctx.resume();
  if(k==='pt2'||k==='ft'){ noise(.28,5200,2600,1.2,.34,.84); tone(880,0,.12,'triangle',.07,.84); }            // le filet
  else if(k==='pt3'){ noise(.32,5600,2400,1.2,.38,.84); tone(659,0,.14,'triangle',.11,.9); tone(988,0,.22,'triangle',.11,1.02); } // filet + deux notes
  else if(k==='blk'){ tone(150,48,.2,'sine',.5,.42); noise(.07,1400,500,.8,.3,.42); }                          // la claque
  else if(k==='stl'){ noise(.3,700,3800,2.5,.26,.36); }                                                        // le souffle
  else if(k==='to'){ tone(330,262,.2,'sawtooth',.08,.1); tone(247,165,.36,'sawtooth',.08,.34); }              // deux notes qui descendent
  else if(k==='foul'){ tone(2900,2750,.26,'square',.05,0); }                                                   // le sifflet
  else if(k==='tech'){ tone(2900,2750,.2,'square',.06,0); tone(2900,2600,.34,'square',.06,.28); }
  else if(k==='win'){ [523,659,784,1047].forEach((f,i)=>tone(f,0,.3,'triangle',.13,i*.12)); }
  }catch(e){} }
function setSound(on){ SND.on=on; const b=$('#snd'); if(on&&!SND.ctx){ try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ SND.on=false; } } if(SND.on&&SND.ctx&&SND.ctx.state==='suspended') SND.ctx.resume(); b.classList.toggle('on',SND.on); b.textContent=SND.on?'🔊 Son':'🔇 Son'; b.setAttribute('aria-pressed',SND.on?'true':'false'); try{ localStorage.setItem('hs-direct-son',SND.on?'1':'0'); }catch(e){} if(SND.on) tone(880,0,.1,'triangle',.08,0); }
$('#snd').addEventListener('click',()=>setSound(!SND.on));
// ---------- données ----------
function setSession(s){ if(!REPLAY&&s){ // Écart d'horloge entre la table et ce téléphone : mesuré seulement quand une action toute neuve arrive (son heure de saisie contre l'heure de réception).
    let mx=0; (s.matches||[]).forEach(m=>{ mx=Math.max(mx,m.createdAt||0); (m.events||[]).forEach(e=>{ if(e.t>mx) mx=e.t; }); });
    if(D.maxT&&mx>D.maxT){ const off=Date.now()-mx; if(Math.abs(off)<300000) D.offset=D.offset===null?off:Math.min(D.offset,off); } D.maxT=Math.max(D.maxT||0,mx); }
  if(D.sess&&s&&D.sess.id!==s.id){ D.seen=null; D.feed=[]; D.queue=[]; D.closed=false; D.closedShown=false; $('#colA').innerHTML=''; }
  D.mode='ok'; if(!s&&D.sess){ D.closed=true; return; } // la table vient de clôturer : on finit d'afficher ce qui reste dans le différé, puis l'écran de fin
  if(s){ D.closed=false; } D.sess=s; if(!s){ render(); } }
async function boot(){ D.mode='load'; render();
  try{
    if(SRC){ if(!/^[\w./-]+\.json$/.test(SRC)||SRC.includes('..')) throw new Error('source refusée'); const d=await (await fetch(SRC)).json(); D.players=d.players||{}; D.cfg={...D.cfg,...((d.config||{}).main||{})}; const L=Object.values(d.sessions||{}).filter(s=>(s.matches||[]).length).sort((a,b)=>a.date<b.date?1:-1); startReplay(L[0]); return; }
    firebase.initializeApp(window.FIREBASE_CONFIG); const fs=firebase.firestore();
    fs.doc('config/main').get().then(sn=>{ if(sn.exists) D.cfg={...D.cfg,...sn.data()}; }).catch(()=>{});
    const ps=await fs.collection('players').get(); (ps.docs||[]).forEach(d=>D.players[d.id]=d.data());
    if(REPLAY){ const q=await fs.collection('sessions').where('status','==','closed').get(); const L=[]; (q.docs||[]).forEach(d=>L.push({id:d.id,...d.data()})); startReplay(L.filter(s=>(s.matches||[]).length&&!s.excluded).sort((a,b)=>a.date<b.date?1:-1)[0]); return; }
    fs.collection('sessions').where('status','==','live').onSnapshot(q=>{ let s=null; (q.docs||[]).forEach(d=>{ const x={id:d.id,...d.data()}; if(!s||x.date>s.date) s=x; }); setSession(s); tick(); },()=>{ D.mode='ok'; render(); });
    setInterval(tick,500);
  }catch(e){ console.error(e); D.mode='ok'; D.sess=null; render(); } }
function startReplay(s){ if(!s){ D.mode='ok'; render(); return; } D.sess=s; D.tl=items(s); D.vt=(D.tl[0]?D.tl[0].t:0)-1500; D.seen=new Set(); D.rt0=performance.now(); D.mode='ok'; setInterval(tick,200); tick(); }
D.api={play,describe,pushFeed}; window.__direct=D; boot();
</script></body></html>
