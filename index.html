<script>// ---------- Hoops Stats · couche Firebase (remplace la base de l'artefact Claude) ----------
(function(){
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !window.firebase){ return; } // sans config : l'appli tombe en mode entraînement local
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  try{ fs.settings({ ignoreUndefinedProperties:true }); }catch(e){}
  try{ fs.enablePersistence({ synchronizeTabs:true }).catch(()=>{}); }catch(e){}

  const qs = new URLSearchParams(location.search);
  const FB = window.FB = {
    auth, fs,
    role: 'viewer',           // viewer | bureau | scorer
    email: null,
    scorerToken: qs.get('marqueur') || null,
    scorerSid: qs.get('seance') || null,
    ready: null,
    listeners: []
  };

  // --- rôle : bureau si connecté par email et présent dans config/bureau ---
  async function resolveRole(user){
    if(!user){ FB.role='viewer'; FB.email=null; return; }
    if(user.isAnonymous){ FB.role = FB.scorerToken ? 'scorer' : 'viewer'; FB.email=null; return; }
    FB.email = user.email || null;
    try{
      const d = await fs.doc('config/bureau').get();
      const emails = (d.exists && Array.isArray(d.data().emails)) ? d.data().emails.map(x=>String(x).toLowerCase()) : [];
      FB.role = emails.includes(String(user.email||'').toLowerCase()) ? 'bureau' : 'viewer';
      if(FB.role==='viewer' && !d.exists){ FB.role='bootstrap'; } // première connexion : la liste du bureau n'existe pas encore
    }catch(e){ FB.role='viewer'; }
  }

  FB.ready = new Promise(res=>{
    const un = auth.onAuthStateChanged(async u=>{ await resolveRole(u); FB.listeners.forEach(f=>f()); res(); });
  });

  // connexion anonyme pour tout visiteur (nécessaire au lien marqueur et au compteur de fréquentation ; aucune donnée personnelle)
  FB.ready.then(()=>{ if(!auth.currentUser){ auth.signInAnonymously().catch(()=>{}); } });
  // compteur de fréquentation : 1 ouverture par session d'appli, appareil identifié par un jeton aléatoire local (pas de cookie tiers, pas de nom)
  FB.countVisit = async ()=>{ try{ if(sessionStorage.getItem('hs-visit')) return; let did=localStorage.getItem('hs-did'); if(!did){ did=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join(''); localStorage.setItem('hs-did',did); } await FB.ready; if(!auth.currentUser) await auth.signInAnonymously(); const day=new Date().toISOString().slice(0,10); await fs.doc('visits/'+day).set({count:firebase.firestore.FieldValue.increment(1),devices:firebase.firestore.FieldValue.arrayUnion(did)},{merge:true}); sessionStorage.setItem('hs-visit','1'); }catch(e){} };
  FB.visitStats = async (days=14)=>{ const out=[]; const q=await fs.collection('visits').orderBy(firebase.firestore.FieldPath.documentId(),'desc').limit(days).get(); q.docs.forEach(d=>{ const x=d.data(); out.push({day:d.id,count:x.count||0,devices:(x.devices||[]).length}); }); return out; };
  setTimeout(()=>FB.countVisit(),1500);

  FB.login = async (email,pass)=>{ await auth.signInWithEmailAndPassword(email.trim(),pass); await resolveRole(auth.currentUser); FB.listeners.forEach(f=>f()); return FB.role; };
  FB.logout = async ()=>{ await auth.signOut(); FB.role='viewer'; FB.email=null; FB.listeners.forEach(f=>f()); };
  FB.resetPassword = (email)=>auth.sendPasswordResetEmail(email.trim());
  FB.canWrite = ()=>FB.role==='bureau' || FB.role==='scorer';

  // --- création de la liste bureau au premier lancement ---
  FB.bootstrapBureau = async (emails)=>{ await fs.doc('config/bureau').set({emails}); await resolveRole(auth.currentUser); FB.listeners.forEach(f=>f()); };

  // --- lien marqueur ---
  FB.createScorerLink = async (sid,label)=>{
    const token = Array.from(crypto.getRandomValues(new Uint8Array(9))).map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
    const end = new Date(); end.setHours(23,59,0,0);
    await fs.doc('scorerTokens/'+token).set({ sid, label:label||'', expires: firebase.firestore.Timestamp.fromDate(end), createdBy: FB.email||'', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    const url = location.origin + location.pathname + '?marqueur=' + token + '&seance=' + encodeURIComponent(sid);
    return { token, url, expires:end };
  };
  FB.revokeScorerLink = (token)=>fs.doc('scorerTokens/'+token).delete();
  FB.listScorerLinks = async (sid)=>{ const q=await fs.collection('scorerTokens').where('sid','==',sid).get(); return q.docs.map(d=>({token:d.id,...d.data()})); };

  // --- adaptateur "db" au format attendu par l'appli (doc/collection/onSnapshot/set/delete) ---
  const strip = (o)=>JSON.parse(JSON.stringify(o));
  FB.db = {
    doc:(path)=>({
      onSnapshot:(f,err)=>fs.doc(path).onSnapshot(sn=>f({exists:sn.exists,data:()=>sn.data()}), e=>{ if(err) err(e); }),
      set:async(d,opt)=>{ const data=strip(d); if(path.startsWith('sessions/') && FB.role==='scorer' && FB.scorerToken) data.scorerToken=FB.scorerToken; if(opt&&opt.merge) await fs.doc(path).set(data,{merge:true}); else await fs.doc(path).set(data); },
      delete:()=>fs.doc(path).delete()
    }),
    collection:(c)=>({
      onSnapshot:(f,err)=>fs.collection(c).onSnapshot({includeMetadataChanges:false}, sn=>f({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()})),empty:sn.empty,metadata:{fromCache:sn.metadata.fromCache}}), e=>{ if(err) err(e); }),
      doc:(id)=>FB.db.doc(c+'/'+id)
    })
  };

  // --- import initial (bureau) ---
  FB.importAll = async (dump, progress)=>{
    let n=0; let batch=fs.batch(); let inBatch=0;
    for(const [col,docs] of Object.entries(dump)){
      if(col==='config' && docs.bureau) continue;
      for(const [id,data] of Object.entries(docs)){
        batch.set(fs.doc(col+'/'+id), strip(data)); inBatch++; n++;
        if(inBatch>=400){ await batch.commit(); batch=fs.batch(); inBatch=0; if(progress) progress(n); }
      }
    }
    if(inBatch) await batch.commit();
    return n;
  };

  // --- export complet (bureau) ---
  FB.exportAll = async ()=>{ const out={}; for(const c of ['config','players','sessions','sanctions','payments','treasury','scorerTokens']){ const q=await fs.collection(c).get(); out[c]={}; q.docs.forEach(d=>out[c][d.id]=d.data()); } return out; };

  // --- téléchargements (remplace la capacité "downloads" de l'artefact) ---
  FB.downloads = { save: async ({filename,data})=>{ const blob = data instanceof Blob ? data : new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); return {status:'saved'}; } };

  // --- interface "claude.use" attendue par l'appli ---
  window.claude = { use: async (name)=>{
    await FB.ready;
    if(name==='db') return FB.db;
    if(name==='user') return { can: async (perm)=> perm==='data.write' ? FB.canWrite() : true };
    if(name==='downloads') return FB.downloads;
    return null;
  } };
})();
</script>

.log{font-size:13px;max-height:180px;overflow:auto} .log div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px} .log .t{color:var(--muted);width:44px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-fg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:90%}
textarea{width:100%;min-height:220px;font:16px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
.lead{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .lead:last-child{border:0}
.lead .ico{font-size:26px;width:36px;text-align:center} .lead .who{font-weight:700;font-size:16px} .lead .what{font-size:13px;color:var(--muted)}
.lead .big{margin-left:auto;font-family:var(--display);font-size:28px;font-weight:800}
.podium{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:8px;align-items:end;margin:6px 0 4px}
.pod{min-width:0;border-radius:12px 12px 6px 6px;padding:12px 6px 10px;text-align:center;background:var(--line);position:relative}
.pod.p1{background:var(--navy);color:var(--navy-fg);min-height:132px} .pod.p2{min-height:108px} .pod.p3{min-height:92px}
.pod .medal{font-size:26px;line-height:1} .pod .nm{font-weight:700;font-size:14px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .pod .v{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;margin-top:4px} .pod.p1 .v{color:var(--accent)} .pod .s{font-size:11px;color:var(--muted)} .pod.p1 .s{color:#C9D0DD}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:8px;align-items:center;padding:5px 0;font-size:13px} .hbar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hbar .tr{height:14px;background:var(--line);border-radius:4px;overflow:hidden} .hbar .fl{height:100%;background:var(--navy);border-radius:0 4px 4px 0} .hbar.top .fl{background:var(--accent)} .hbar .v{text-align:right;font-weight:700}
.stk{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:transparent} .stk i{display:block;height:100%} .stk .w{background:var(--tX)} .stk .l{background:var(--line)}
.spark{width:100%;height:56px;display:block} .wl{display:flex;gap:3px;flex-wrap:wrap} .wl i{width:10px;height:10px;border-radius:2px;background:var(--line)} .wl i.w{background:var(--good)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px} .day{border-radius:10px;padding:8px 4px;text-align:center;background:var(--panel);box-shadow:var(--shadow);min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px;border:2px solid transparent}
.day .d{font-size:12px;font-weight:700} .day .m{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .day .h{font-family:var(--display);font-size:18px;font-weight:800;line-height:1}
.day.held{background:color-mix(in srgb,var(--good) 16%,var(--panel));border-color:var(--good)} .day.extra{background:color-mix(in srgb,var(--accent) 18%,var(--panel));border-color:var(--accent)} .day.off{opacity:.5;text-decoration:line-through} .day.today{outline:2px dashed var(--accent);outline-offset:2px} .day.past{}
.gauge{height:18px;border-radius:9px;background:var(--line);overflow:hidden;display:flex} .gauge i{display:block;height:100%} .gauge .u{background:var(--navy)} .gauge .x{background:var(--accent)} .gauge .p{background:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--muted) 35%,transparent) 4px 8px)}
.payrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .payrow .nm{font-weight:600} .payrow .ok{color:var(--good);font-weight:700;font-size:13px} .payrow select{width:auto;padding:6px 8px;font-size:16px}
.demo{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
@media (max-width:420px){ .board .tm .sc{font-size:52px} .courts{grid-template-columns:1fr 1fr;gap:6px} .pbtn{padding:8px 6px;min-height:50px}.qb{width:40px;font-size:15px;border-radius:8px}.prow{gap:4px}.pbtn .nm{font-size:14px} .pbtn .st{display:none} }
@media (prefers-reduced-motion:no-preference){ #main.enter>*{animation:fadein .16s ease-out} @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} .lead,.chip,.btn,.pbtn,.qb,.tabs button{transition:transform .08s ease,background .15s ease,opacity .15s ease} .lead:active,.chip:active,.btn:active{transform:scale(.985)} .tile{transition:transform .15s ease} .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(30px);opacity:0}} }
</style>

// ---------- match engine (events are the source of truth) ----------
function matchKey(m){ let k=m.events.length+'|'+(m.winner||'')+'|'+(m.status||'')+'|'+(S.config.teamFoulLimit||6)+'|'+(m.foulRule||''); let acc=0; for(const e of m.events){ acc+=(e.t||0)+(e.edited||0)+(e.v||0)+(e.made?1:0); if(e.pid) acc+=e.pid.length; } return k+'|'+acc+'|'+JSON.stringify(m.lineup||{}).length; }

    if(e.type==='pt'){ st.score[e.team]+=e.v; const p=P(e.pid); p.pts+=e.v; if(e.v===3)p.fg3++; else p.fg2++; st.on[e.team].forEach(x=>P(x).pm+=e.v); st.on[other(e.team)].forEach(x=>P(x).pm-=e.v); }

    else if(e.type==='tech'){ P(e.pid).tech++; }

// ---------- demo data (in memory only, never saved) ----------
const DEMO={players:{},sessions:{}};
function buildDemo(){
  const names=['Yannick','Serge','Franck','Patrick','Cédric','Hervé','Landry','Steve','Christian','Rodrigue','Boris','Arnaud','Jean-Marc','Thierry','Éric','Olivier','Didier','Ludovic','Alain','Joël','Fabrice'];
  names.forEach((n,i)=>DEMO.players['d'+i]={id:'d'+i,name:n+' (démo)',member:i<12,active:true});
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  ['2026-09-06','2026-09-13','2026-09-20','2026-09-27'].forEach((date,si)=>{
    const ids=Object.keys(DEMO.players).sort(()=>rnd()-.5).slice(0,21);
    const teams={A:{name:'Orange',players:ids.slice(0,7)},B:{name:'Bleu',players:ids.slice(7,14)},C:{name:'Vert',players:ids.slice(14,21)}};
    const matches=[]; let home='A',away='B',wait='C';
    for(let n=1;n<=12;n++){
      const m={n,home,away,lineup:{[home]:teams[home].players.slice(0,5),[away]:teams[away].players.slice(0,5)},events:[],status:'done',elapsedMs:600000,running:false};
      const sc={[home]:0,[away]:0}; let t=0;
      while(sc[home]<12&&sc[away]<12&&t<40){ t++; const team=rnd()<.5?home:away; const pid=teams[team].players[Math.floor(rnd()*5)]; const r=rnd();
        if(r<.62){ m.events.push({t,type:'pt',team,pid,v:2}); sc[team]+=2; } else if(r<.8){ m.events.push({t,type:'pt',team,pid,v:3}); sc[team]+=3; }
        else if(r<.9){ m.events.push({t,type:'foul',team,pid}); const o=team===home?away:home; const sh=teams[o].players[Math.floor(rnd()*5)]; if(rnd()<.4){ const made=rnd()<.65; m.events.push({t,type:'ft',team:o,pid:sh,made}); if(made)sc[o]++; } }
        else if(r<.93){ m.events.push({t,type:'tech',team,pid}); } else if(r<.95){ m.events.push({t,type:'uns',team,pid}); }
        else { const on=m.lineup[team]; const bench=teams[team].players.filter(p=>!on.includes(p)); if(bench.length){ m.events.push({t,type:'sub',team,out:on[Math.floor(rnd()*5)],in:bench[Math.floor(rnd()*bench.length)]}); } } }
      m.winner = sc[home]>=sc[away]? home: away; m.endReason = sc[home]>=12||sc[away]>=12?'points':'time';
      matches.push(m); const loser=m.winner===home?away:home; home=m.winner; away=wait; wait=loser;
    }
    DEMO.sessions['s'+si]={id:'s'+si,date,teams,matches,status:'closed',createdAt:0};
  });
}
function setDemo(on){ S.demo=on; if(on){ if(!Object.keys(DEMO.players).length) buildDemo(); S._real={players:S.players,sessions:S.sessions,sid:S.sid,sanctions:S.sanctions}; S.players=DEMO.players; S.sessions=DEMO.sessions; S.sanctions={}; S.sid='s3'; S.view='stats'; }

let AC=null; function actx(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
document.addEventListener('pointerdown',()=>actx(),{passive:true});
function tone(freq,ms,type,vol){ const a=actx(); if(!a) return; try{ const o=a.createOscillator(); const g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol||.3; o.connect(g); g.connect(a.destination); o.start(); g.gain.setValueAtTime(vol||.3,a.currentTime+ms/1000-0.03); g.gain.linearRampToValueAtTime(0.0001,a.currentTime+ms/1000); o.stop(a.currentTime+ms/1000+0.02); }catch(e){} }
function beep(){ tone(880,350,'sine',.3); }
function tick(){ tone(1200,80,'square',.12); }
function buzzer(){ tone(180,1300,'sawtooth',.6); tone(240,1300,'square',.3); try{ navigator.vibrate&&navigator.vibrate([400,100,400]); }catch(e){} }

// ---------- actions ----------
function startSetup(prep){ S.setup={id:prep?prep.id:null,date:prep?prep.date:nextSunday(),present:prep?[...(prep.present||[])]:[],nteams:3,format:'rotation',teams:{A:{name:TNAMES.A,color:'noir',players:[]},B:{name:TNAMES.B,color:'vert',players:[]},C:{name:TNAMES.C,color:'rouge',players:[]},D:{name:TNAMES.D,color:'jaune',players:[]}},home:'A',away:'B',q:''}; go('setup'); }
function activeTeams(st){ if(st.format==='cent') return ['A','B']; return TEAMS.slice(0,st.nteams||TEAMS.filter(t=>st.teams[t]&&st.teams[t].players.length).length||3); }
function cycle(id){ const st=S.setup; const T=activeTeams(st); const cur=TEAMS.find(t=>st.teams[t].players.includes(id)); TEAMS.forEach(t=>st.teams[t].players=st.teams[t].players.filter(x=>x!==id));
  const order=[...T,null]; let next=order[(order.indexOf(cur===undefined?null:cur)+1)%order.length]; let tries=0; const cap=st.format==='cent'?12:7; while(next&&st.teams[next].players.length>=cap&&tries<order.length){ next=order[(order.indexOf(next)+1)%order.length]; tries++; } if(next) st.teams[next].players.push(id); }
function setCaptain(st,t,pid){ TEAMS.forEach(k=>{ if(st.teams[k]&&st.teams[k].captain===pid&&k!==t) st.teams[k].captain=null; }); st.teams[t].captain=pid||null; if(pid){ TEAMS.forEach(k=>{ if(st.teams[k]) st.teams[k].players=st.teams[k].players.filter(x=>x!==pid); }); st.teams[t].players.unshift(pid); } }
function draftTeam(d){ const n=d.order.length; const r=Math.floor(d.turn/n); const i=d.turn%n; return d.order[r%2===0?i:n-1-i]; }
function draftStart(){ const st=S.setup; const T=activeTeams(st); TEAMS.forEach(t=>{ if(st.teams[t]) st.teams[t].players=st.teams[t].players.filter(x=>x===st.teams[t].captain); }); st.draft={order:[...T].sort(()=>Math.random()-.5),turn:0,picks:[]}; toast('Draft lancé : ordre tiré au sort'); }
function draftPick(id){ const st=S.setup; const d=st.draft; if(!d) return; const t=draftTeam(d); const cap=st.format==='cent'?12:7; if(st.teams[t].players.length>=cap){ d.turn++; return; } TEAMS.forEach(k=>{ if(st.teams[k]) st.teams[k].players=st.teams[k].players.filter(x=>x!==id); }); st.teams[t].players.push(id); d.picks.push({pid:id,team:t,n:d.picks.length+1,t:Date.now()}); d.turn++; const teamOf=x=>TEAMS.find(k=>st.teams[k]&&st.teams[k].players.includes(x)); if(!st.present.some(x=>!teamOf(x))){ toast('Draft terminé, tout le monde a une équipe'); } }
function autoTeams(){ const st=S.setup; const ids=[...st.present].sort(()=>Math.random()-.5); TEAMS.forEach(t=>st.teams[t].players=[]); const T=activeTeams(st); const n=st.format==='cent'?2:Math.min(T.length, ids.length>14?T.length:2); ids.forEach((id,i)=>st.teams[T[i%n]].players.push(id)); }
function startSession(){ const st=S.setup; const id=st.id||uid(); TEAMS.forEach(t=>st.teams[t].players=st.teams[t].players.filter(x=>st.present.includes(x))); if(st.format==='cent'){ st.teams.C={name:TNAMES.C,color:'rouge',players:[]}; } activeTeams(st).length<4 && (st.teams.D={name:TNAMES.D,color:'jaune',players:[]});
  const s={id,date:st.date,format:st.format||'rotation',teams:clone(st.teams),draft:st.draftLog||(st.draft?{order:st.draft.order,picks:st.draft.picks}:null),present:[...st.present],matches:[],status:'live',nextHome:st.home,nextAway:st.away,createdAt:Date.now()};
  S.sid=id; saveSession(s); if(st.format==='cent') startMatch(s,'A','B'); else startMatch(s,st.home,st.away); S.setup=null; go('live'); }
function startMatch(s,home,away){ if(home===away||!s.teams[home].players.length||!s.teams[away].players.length){ toast('Choisissez deux équipes différentes'); return; }
  const m={n:s.matches.length+1,home,away,lineup:{[home]:s.teams[home].players.slice(0,5),[away]:s.teams[away].players.slice(0,5)},roster:{home:[...s.teams[home].players],away:[...s.teams[away].players]},events:[],status:'live',elapsedMs:0,running:false,startedAt:null,createdAt:Date.now()};
  if(s.format==='cent'){ const prev=s.matches.filter(x=>x.status==='done'&&x.quarter); const q=prev.length+1; const cum={[home]:0,[away]:0}; prev.forEach(x=>{ const st=matchState(x,s); cum[x.home]=(cum[x.home]||0)+st.score[x.home]; cum[x.away]=(cum[x.away]||0)+st.score[x.away]; }); const last=prev[prev.length-1]; if(last){ m.lineup={[home]:[...(last.lineup[home]||m.lineup[home])],[away]:[...(last.lineup[away]||m.lineup[away])]}; } m.quarter=q; m.cum=cum; m.foulRule='continuous'; m.target=25*q; }
  s.matches.push(m); saveSession(s,['matches','nextHome','nextAway']); }
function addEvent(s,m,e){ e.t=Date.now(); e.el=elapsed(m); m.events.push(e);
  if(s.format!=='cent'){ const whistle=['foul','tech','uns','ft','out'].includes(e.type); if(!m.running&&!m.endedAt&&(m.elapsedMs||0)===0&&e.type!=='out'){ m.running=true; m.startedAt=Date.now(); } else if(m.running&&whistle&&remaining(m)<=60000){ m.elapsedMs=elapsed(m); m.running=false; m.startedAt=null; m.stoppedBy=e.type; } }
  if(e.type==='pt'||e.type==='foul'||e.type==='uns'||e.type==='tech') startShot(20); if(e.type==='out') startShot(20);
  const st=matchState(m,s); saveSession(s,['matches']);
  if(s.format==='cent'){ const cum=t=>(m.cum&&m.cum[t]||0)+st.score[t]; const reached=[m.home,m.away].find(t=>cum(t)>=m.target); if(reached){ S.sheet=null; S.subOut=null; endMatch(s,m,reached); if(m.quarter<4){ startMatch(s,m.home,m.away); toast((m.quarter===2?'Mi-temps · ':'')+'Fin du quart-temps '+m.quarter+' · '+(s.teams[reached].name||reached)+' atteint '+m.target); } else { toast('Match à 100 points terminé : '+(s.teams[reached].name||reached)+' gagne'); } } return; }
  const tgt=S.config.target||12; if(st.score[m.home]>=tgt||st.score[m.away]>=tgt){ S.sheet={type:'end'}; } }
function endMatch(s,m,winner){ stopShot(); m.status='done'; m.winner=winner; m.running=false; m.elapsedMs=elapsed(m); m.startedAt=null; m.endReason=remaining(m)===0?'time':'points'; m.endedAt=Date.now(); S.sheet=null; saveSession(s,['matches','nextHome','nextAway']); toast('Match '+m.n+' terminé'); }
async function exportCsv(){ const sess=periodSessions(); const ag=aggregate(sess); const head=['Joueur','Seances','Matchs','Victoires','Points','Paniers2','Paniers3','PassesDecisives','LF_reussis','LF_tentes','Fautes','Techniques','Antisportives','PlusMinus'];
  const lines=[head.join(';')].concat(ag.pl.map(r=>[pname(r.id),r.sessions,r.gp,r.w,r.pts,r.fg2,r.fg3,r.ast||0,r.ftm,r.fta,r.pf,r.tech,r.uns,r.pm].join(';')));
  try{ await S.downloads.save({filename:'hoops-stats-'+S.period+'.csv',data:'﻿'+lines.join('\n')}); toast('CSV enregistré'); }catch(e){ if(e&&e.code!=='declined') toast('Export impossible'); } }

document.addEventListener('input',ev=>{ const t=ev.target; if(t.id==='pq2'){ S.pq=t.value; const q=String(t.value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); let n=0; document.querySelectorAll('#plist [data-search]').forEach(el=>{ const ok=!q||el.dataset.search.includes(q); el.hidden=!ok; if(ok) n++; }); const e=$('#plistEmpty'); if(e) e.hidden=n>0; return; } if(t.id==='pq'&&S.setup){ S.setup.q=t.value; const q=String(t.value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); document.querySelectorAll('#pchips [data-search]').forEach(el=>{ el.hidden=!!q&&!el.dataset.search.includes(q); }); return; } if(t.dataset.teamName&&S.setup){ S.setup.teams[t.dataset.teamName].name=t.value; } if(t.id==='sdate'&&S.setup) S.setup.date=t.value; });
document.addEventListener('change',ev=>{ const t=ev.target; if(t.dataset.teamCap&&S.setup){ setCaptain(S.setup,t.dataset.teamCap,t.value); render(); return; } if(t.dataset.teamColor&&S.setup){ const k=t.dataset.teamColor; const tm=S.setup.teams[k]; const wasDefault=!tm.name||tm.name===TNAMES[k]||CHASUBLES.some(c=>c[1]===tm.name); tm.color=t.value; if(wasDefault) tm.name=CHAS[t.value][1]; render(); return; } if(t.id==='tpaySel'){ S.tpay=t.value; render(); return; } if(S.sheet&&S.sheet.type==='sanction'&&(t.id==='snPid'||t.id==='snType'||t.id==='snDate')){ const x=S.sheet.sid?S.sanctions[S.sheet.sid]:null; const draft={pid:$('#snPid').value,date:$('#snDate').value,type:$('#snType').value,sanction:'',until:$('#snUntil').value,note:$('#snNote').value,fine:$('#snFine').checked,finePaid:$('#snFinePaid').checked,fineMode:$('#snFineMode').value}; if(x){ S.sanctions[S.sheet.sid]={...x,...draft,sanction:x.sanction}; } else { S.sheet.draft=draft; } S.skipPreserve=['snSanction']; render(); return; } if(t.id==='refSess'){ S.sid=t.value; render(); } if(t.id==='m1home'&&S.setup) S.setup.home=t.value; if(t.id==='m1away'&&S.setup) S.setup.away=t.value; });
document.addEventListener('click',async ev=>{
  if(ev.target.id==='pendPill'){ retryFailed(); toast('Nouvel essai…'); return; }
  const stop=ev.target.closest('[data-stop]'); const bg=ev.target.closest('.sheet-bg');
  const el=ev.target.closest('[data-dfilter],[data-pstatus],[data-pfilter],[data-stats-seg],[data-bureau-seg],[data-act],[data-go],[data-period],[data-sort],[data-ev],[data-win],[data-ast]');
  if(!el){ if(bg&&!stop){ S.sheet=null; S.subOut=null; render(); } return; }
  if(el.dataset.go){ go(el.dataset.go==='bureau'?(S.bureauView||'discipline'):el.dataset.go); return; }
  if(el.dataset.pstatus){ const v=el.dataset.pstatus; $('#pestatus').value=v; el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.pstatus===v)); return; }
  if(el.dataset.dfilter){ S.dFilter=el.dataset.dfilter; render(); return; }
  if(el.dataset.pfilter){ S.pFilter=el.dataset.pfilter; render(); return; }
  if(el.dataset.statsSeg){ S.statsSeg=el.dataset.statsSeg; render(); return; }
  if(el.dataset.bureauSeg){ go(el.dataset.bureauSeg); return; }
  if(el.dataset.period){ S.period=el.dataset.period; try{localStorage.setItem('hs-period',S.period);}catch(e){} render(); return; }
  if(el.dataset.sort){ const k=el.dataset.sort; S.sort = S.sort.k===k? {k,d:-S.sort.d} : {k,d:-1}; render(); return; }
  const s=curSession(); const m=liveMatch(s);
  if(el.dataset.ev&&m&&S.sheet&&S.sheet.type==='player'){ const {pid,team}=S.sheet; const e=el.dataset.ev; S.sheet=null;
    if(e==='pt2'||e==='pt3'){ addEvent(s,m,{type:'pt',team,pid,v:e==='pt2'?2:3}); if(!S.sheet&&S.config.assists!==false){ const st=matchState(m,s); const mates=st.on[team].filter(x=>x!==pid); if(mates.length) S.sheet={type:'assist',team,scorer:pid,mates}; } } else if(e==='ft1') addEvent(s,m,{type:'ft',team,pid,made:true}); else if(e==='ft0') addEvent(s,m,{type:'ft',team,pid,made:false});
    else if(e==='foul') addEvent(s,m,{type:'foul',team,pid}); else if(e==='tech'||e==='uns'){ S.sheet={type:'confirm',kind:e,pid,team}; render(); return; } else if(e==='subout'){ S.subOut=pid; S.subTeam=team; }
    if(e!=='subout'){ const last=m.events[m.events.length-1]; if(last&&!S.sheet) toastUndo(evLabel(last,s).replace(/<[^>]+>/g,'')); }
    render(); return; }
  if(el.dataset.win&&m){ endMatch(s,m,el.dataset.win); go('live'); return; }
  if(el.dataset.ast!==undefined&&S.sheet&&S.sheet.type==='assist'){ const {team}=S.sheet; const pid=el.dataset.ast; S.sheet=null; if(pid&&m){ addEvent(s,m,{type:'ast',team,pid}); } render(); return; }
  const a=el.dataset.act, id=el.dataset.id;
  try{ switch(a){
    case 'sheet-close': if(ev.target.closest('[data-stop]')&&!ev.target.closest('button[data-act="sheet-close"]')) return; S.sheet=null; S.subOut=null; S.subIn=null; render(); break;
    case 'recover': S.view='home'; S.sheet=null; S.setup=null; S.subOut=null; render(); break;
    case 'demo-on': setDemo(true); break; case 'demo-off': setDemo(false); break;
    case 'unlock': { const v=($('#pinIn')||{}).value||''; if(v===String(S.config.pin)){ S.unlocked=true; try{localStorage.setItem('hs-unlocked','1');}catch(e){} toast('Table de marque ouverte'); } else toast('Code incorrect'); render(); break; }
    case 'fb-login': { const em=($('#fbEmail')||{}).value||'', pw=($('#fbPass')||{}).value||''; if(!em||!pw){ toast('Email et mot de passe'); break; } try{ const r=await FB.login(em,pw); syncRole(); if(r==='bureau') toast('Bienvenue '+em); else if(r==='bootstrap') toast('Première connexion : importez les données'); else toast('Ce compte n\'est pas dans la liste du bureau'); }catch(e){ toast('Connexion refusée : '+(e&&e.code==='auth/wrong-password'||e&&e.code==='auth/invalid-credential'?'mot de passe incorrect':e&&e.code==='auth/user-not-found'?'compte inconnu':(e&&e.message||'erreur'))); } render(); break; }
    case 'fb-reset': { const em=($('#fbEmail')||{}).value||prompt('Votre email bureau ?')||''; if(!em) break; try{ await FB.resetPassword(em); toast('Email de réinitialisation envoyé'); }catch(e){ toast('Impossible : '+(e&&e.code||'')); } break; }
    case 'fb-import': { const inp=$('#impFile'); const file=inp&&inp.files&&inp.files[0]; if(!file){ toast('Choisissez le fichier hba-export.json'); break; } const emails=(($('#bureauEmails')||{}).value||'').split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>x.includes('@')); if(!emails.length){ toast('Indiquez au moins un email bureau'); break; } try{ const dump=JSON.parse(await file.text()); toast('Import en cours…'); if(S.bootstrap||!(await FB.fs.doc('config/bureau').get()).exists) await FB.bootstrapBureau(emails); const n=await FB.importAll(dump,k=>toast(k+' documents…')); syncRole(); toast(n+' documents importés'); }catch(e){ console.error(e); toast('Import échoué : '+(e&&e.message||e)); } render(); break; }
    case 'fb-export': { try{ const dump=await FB.exportAll(); await FB.downloads.save({filename:'hba-export-'+today()+'.json',data:JSON.stringify(dump,null,1)}); toast('Export téléchargé'); }catch(e){ toast('Export impossible : '+(e&&e.code||'')); } break; }
    case 'scorer-links': { S.sheet={type:'scorer',sid:id||(s&&s.id),links:null}; render(); try{ S.sheet.links=await FB.listScorerLinks(S.sheet.sid); }catch(e){ S.sheet.links=[]; } render(); break; }
    case 'scorer-create': { try{ const lab=($('#scLabel')||{}).value||''; const r=await FB.createScorerLink(S.sheet.sid,lab); S.sheet.links=await FB.listScorerLinks(S.sheet.sid); S.sheet.newUrl=r.url; toast('Lien créé, valable jusqu\'à ce soir'); }catch(e){ toast('Création impossible : '+(e&&e.code||e)); } render(); break; }
    case 'scorer-revoke': { try{ await FB.revokeScorerLink(id); S.sheet.links=await FB.listScorerLinks(S.sheet.sid); toast('Lien désactivé'); }catch(e){ toast('Impossible'); } render(); break; }
    case 'scorer-copy': { const u=el.dataset.url; try{ if(navigator.share){ await navigator.share({title:'Table de marque Hoops',text:'Lien table de marque (valable aujourd\'hui)',url:u}); } else { await navigator.clipboard.writeText(u); toast('Lien copié'); } }catch(e){ try{ await navigator.clipboard.writeText(u); toast('Lien copié'); }catch(e2){ prompt('Copiez ce lien :',u); } } break; }
    case 'me-set': { const v=($('#meSel')||{}).value; if(v){ S.me=v; try{ localStorage.setItem('hs-me',v); }catch(e){} render(); } break; }
    case 'me-clear': { S.me=null; try{ localStorage.removeItem('hs-me'); }catch(e){} render(); break; }
    case 'theme': { let t='auto'; try{ t=localStorage.getItem('hs-theme')||'auto'; }catch(e){} const nx=t==='auto'?'light':t==='light'?'dark':'auto'; try{ localStorage.setItem('hs-theme',nx); }catch(e){} applyTheme(); toast('Thème '+(nx==='auto'?'automatique':nx==='light'?'clair':'sombre')); break; }
    case 'visits-load': { try{ S.visits=await FB.visitStats(14); }catch(e){ S.visits=[]; toast('Lecture impossible : '+(e&&e.code||'')); } render(); break; }
    case 'config-save': { const c={...S.config,target:+$('#cfTarget').value||12,minutes:+$('#cfMin').value||9,teamFoulLimit:+$('#cfTF').value||6,fineAmount:+$('#cfFine').value||45,assists:$('#cfAst').checked,seasonStart:$('#cfSeason').value||S.config.seasonStart,bureau:$('#cfBureau').value.trim()}; delete c.demo; S.config=c; save('config','main',c); toast('Réglages enregistrés'); render(); break; }
    case 'lock': if(fbMode()){ await FB.logout(); syncRole(); render(); break; } S.unlocked=false; try{localStorage.removeItem('hs-unlocked'); sessionStorage.removeItem('hs-unlocked');}catch(e){} render(); break;
    case 'new-session': startSetup(null); break;
    case 'open-prep': startSetup(S.sessions[id]); break;
    case 'delete-prep': { const px=S.sessions[id]; if(px&&px.status==='setup'&&confirm('Supprimer la préparation du '+fmtDate(px.date)+' ? (aucun match n\'est concerné)')){ delete S.sessions[id]; if(S.sid===id) S.sid=null; if(S.db&&!S.demo){ try{ await S.db.doc('sessions/'+id).delete(); toast('Préparation supprimée'); }catch(e){ toast('Suppression impossible'); } } render(); } break; }
    case 'cancel-setup': S.setup=null; go('home'); break;
    case 'fmt': { S.setup.format=id; if(id==='cent'){ S.setup.nteams=2; ['C','D'].forEach(t=>{ S.setup.teams[t].players=[]; }); } else S.setup.nteams=3; render(); break; }
    case 'nteams': { S.setup.nteams=+el.dataset.n; if(S.setup.nteams===3) S.setup.teams.D.players=[]; render(); break; }
    case 'toggle-present': { const st=S.setup; const sq=sanctionStatus(id); if(!st.present.includes(id)&&sq.susp){ toast(pname(id)+' est suspendu jusqu\'au '+fmtShort(sq.susp.until)); break; } if(!st.present.includes(id)&&sq.fineDue.length){ toast(pname(id)+' : amende non réglée, inscription bloquée'); break; } if(st.present.includes(id)){ st.present=st.present.filter(x=>x!==id); TEAMS.forEach(t=>st.teams[t].players=st.teams[t].players.filter(x=>x!==id)); } else if(st.present.length<21) st.present.push(id); else toast('21 joueurs maximum'); render(); break; }
    case 'add-player-inline': { const q=(S.setup.q||'').trim(); if(!q){ S.sheet={type:'pedit'}; render(); break; } const p={id:uid(),name:q,member:false,active:true,createdAt:Date.now()}; savePlayer(p); S.setup.present.push(p.id); S.setup.q=''; S.skipPreserve=['pq']; render(); break; }
    case 'cycle-team': { const stx=S.setup; const isCap=TEAMS.some(t=>stx.teams[t]&&stx.teams[t].captain===id); if(isCap){ toast('C\'est un capitaine : changez-le dans la liste « Capitaines »'); break; } cycle(id); render(); break; }
    case 'auto-teams': autoTeams(); S.setup.draft=null; render(); break;
    case 'draft-start': draftStart(); render(); break;
    case 'fix-results': { const sx=S.sessions[S.sid]||s||Object.values(S.sessions).filter(x=>x.status==='closed'||x.status==='live').sort((a,b)=>a.date<b.date?1:-1)[0]; if(sx){ S.sheet={type:'fixres',sid:sx.id}; render(); } break; }
