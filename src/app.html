ght:700} .env .e b{font-family:var(--display);font-size:20px} .env .e .s{font-size:11px;color:var(--muted)} .env .e.good b{color:var(--good)} .env .e.bad b{color:var(--bad)} @media (max-width:480px){.env{grid-template-columns:1fr}} .day.off{opacity:.5;text-decoration:line-through} .day.today{outline:2px dashed var(--accent);outline-offset:2px} .day.past{}
.gauge{height:18px;border-radius:9px;background:var(--line);overflow:hidden;display:flex} .gauge i{display:block;height:100%} .gauge .u{background:var(--navy)} .gauge .x{background:var(--accent)} .gauge .p{background:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--muted) 35%,transparent) 4px 8px)}
.payrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .payrow .nm{font-weight:600} .payrow .ok{color:var(--good);font-weight:700;font-size:13px} .payrow select{width:auto;padding:6px 8px;font-size:16px}
.demo{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}

@media (max-width:480px){ .courts{grid-template-columns:1fr;gap:4px} .court+.court{margin-top:8px} .court h3{margin:4px 0 6px} .prow .pbtn{min-height:50px;padding:8px 10px} .qb{width:52px;font-size:18px;min-height:50px} .board{padding:10px 12px} .board .tm .sc{font-size:44px;line-height:1} .board .clock{font-size:34px} .board .meta{display:none} .board .cbtns button{padding:6px 10px;font-size:13px} }
@media (max-width:420px){ .board .tm .sc{font-size:42px} .pbtn{padding:8px 6px;min-height:50px}.qb{width:40px;font-size:15px;border-radius:8px}.prow{gap:4px}.pbtn .nm{font-size:14px} .pbtn .st{display:none} }

async function save(col,id,data,attempt=0,mode='set'){
  if(S.demo){ return; }
  if(!S.db){ toast('Base indisponible : rien n\'est enregistré'); return; }
  const key=col+'/'+id;
  if(S.saving[key]){ const prev=S.dirty[key]; S.dirty[key]=(prev&&prev.__mode==='update'&&mode==='update')?{...prev,...data,__mode:'update'}:(mode==='update'&&!prev?{...data,__mode:'update'}:(mode==='update'&&prev?{...prev,...data,__mode:prev.__mode}:data)); return; }
  S.saving[key]=true; updatePending();
  try{ const payload=clone(data); const md=payload.__mode||mode; delete payload.__mode; if(md==='update'&&S.db.doc(key).set.length>=2) await S.db.doc(key).set(payload,{merge:true}); else if(md==='update'){ const full=stripMemo(S.sessions[id]||payload); await S.db.doc(key).set(full); } else await S.db.doc(key).set(payload); delete S.failed[key]; }
  catch(e){ const code=e&&e.code||'unavailable';
    if(code==='invalid_argument'){ S.canWrite=false; S.failed[key]=data; toast('Écriture refusée : ce compte n\'a que le droit de lecture'); }
    else if(code==='permission-denied'||/permission|insufficient/i.test(String(e&&e.message||''))){ delete S.failed[key]; delete S.dirty[key]; toast(S.scorer?'Refusé : le lien marqueur ne permet que la saisie du match':'Écriture refusée : connectez-vous avec un compte du bureau'); }
    else if(code==='quota_exceeded'){ S.failed[key]=data; toast('Base pleine : contactez Wilfried'); }
    else if(attempt<4){ S.saving[key]=false; setTimeout(()=>{ const d=S.dirty[key]; delete S.dirty[key]; let payload=data, md=mode; if(d){ payload=d; md=d.__mode||'set'; } else if(col==='sessions'&&S.sessions[id]){ const fresh=stripMemo(S.sessions[id]); payload=mode==='update'?Object.fromEntries(Object.keys(data).map(k=>[k,fresh[k]!==undefined?fresh[k]:data[k]])):fresh; } save(col,id,payload,attempt+1,md); },800*Math.pow(2,attempt)+Math.random()*400); return; }
    else { S.failed[key]=data; toast('Hors ligne ? Non enregistré, nouvel essai au prochain changement'); } }
  finally{ S.saving[key]=false; updatePending(); if(S.dirty[key]){ const d=S.dirty[key]; delete S.dirty[key]; save(col,id,d,0,d.__mode||'set'); } }
}

const PHOTO_PX=200;
function shrinkPhoto(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ try{ const sz=Math.min(im.naturalWidth,im.naturalHeight); const c=document.createElement('canvas'); c.width=c.height=PHOTO_PX; const x=c.getContext('2d'); x.imageSmoothingQuality='high';
      // carré centré, légèrement remonté : sur un portrait, le visage est plutôt dans la moitié haute
      const sx=(im.naturalWidth-sz)/2, sy=Math.max(0,(im.naturalHeight-sz)*0.3); x.drawImage(im,sx,sy,sz,sz,0,0,PHOTO_PX,PHOTO_PX); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); }catch(e){ rej(e); } }; im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image illisible')); }; im.src=url; }); }

function mergePlayers(src,dst){ const a=S.players[src], b=S.players[dst]; if(!a||!b||src===dst) return null; const sub=x=>x===src?dst:x; const touched={sessions:0,sanctions:0,payments:0};
  Object.values(S.sessions).forEach(sx=>{ let hit=false; const map=arr=>{ if(!Array.isArray(arr)) return arr; if(arr.includes(src)){ hit=true; const out=arr.map(sub); return out.filter((x,i)=>out.indexOf(x)===i); } return arr; };
    sx.present=map(sx.present); TEAMS.forEach(t=>{ const tm=sx.teams&&sx.teams[t]; if(!tm) return; tm.players=map(tm.players); if(tm.captain===src){ tm.captain=dst; hit=true; } });
    (sx.matches||[]).forEach(m=>{ if(m.roster){ m.roster.home=map(m.roster.home); m.roster.away=map(m.roster.away); } if(m.lineup){ Object.keys(m.lineup).forEach(k=>{ m.lineup[k]=map(m.lineup[k]); }); } (m.events||[]).forEach(e=>{ ['pid','in','out'].forEach(k=>{ if(e[k]===src){ e[k]=dst; hit=true; } }); }); delete m._memo; });
    (sx.changes||[]).forEach(c=>{ if(c.pid===src){ c.pid=dst; hit=true; } }); if(sx.draft&&Array.isArray(sx.draft.picks)) sx.draft.picks.forEach(c=>{ if(c.pid===src){ c.pid=dst; hit=true; } }); ['late','extras','paid'].forEach(k=>{ if(Array.isArray(sx[k])) sx[k]=map(sx[k]); }); (sx.incidents||[]).forEach(c=>{ if(c.pid===src){ c.pid=dst; hit=true; } });
    if(hit){ (sx.corrections=sx.corrections||[]).push({t:Date.now(),by:'bureau',what:'Fiche « '+a.name+' » fusionnée dans « '+b.name+' »'}); touched.sessions++; saveSession(sx); } });
  Object.values(S.sanctions).forEach(x=>{ if(x.pid===src){ x.pid=dst; touched.sanctions++; save('sanctions',x.id,x); } });
  Object.values(S.payments).forEach(pd=>{ if(pd.paid&&pd.paid[src]){ pd.paid[dst]=pd.paid[dst]||pd.paid[src]; delete pd.paid[src]; touched.payments++; save('payments',pd.date,pd); } });
  b.aliases=[...new Set([...(b.aliases||[]),a.name,...(a.aliases||[])])]; if(!b.pos&&a.pos) b.pos=a.pos; if(a.member) b.member=true; if(a.student) b.student=true; if(a.note&&!b.note) b.note=a.note; b.note=((b.note||'')+(b.note?' · ':'')+'Fusion avec '+a.name+' le '+today()).slice(0,400); savePlayer(b);
  S._cache={stats:{},badges:{}}; return touched; }

    collection:(c)=>({ onSnapshot:(f)=>{ f(snap(c)); (subs[c]=subs[c]||[]).push(()=>f(snap(c))); return ()=>{}; }, doc:(id)=>({ set:async(d)=>{ (data[c]=data[c]||{})[id]=clone(d); store(data); notify(c); }, delete:async()=>{ if(data[c]) delete data[c][id]; store(data); notify(c); } }) }) }; }

function matchKey(m){ let k=m.events.length+'|'+(m.winner||'')+'|'+(m.status||'')+'|'+(S.config.teamFoulLimit||6)+'|'+(m.foulRule||''); let acc=0; for(const e of m.events){ acc+=(e.t||0)+(e.edited||0)+(e.v||0)+(e.made?1:0); if(e.pid) acc+=e.pid.length; } return k+'|'+acc+'|'+JSON.stringify(m.lineup||{}); }

const BADGES={hot:['🔥','Chaud bouillant'],sniper:['🎯','Sniper'],wall:['🧱','Le Mur (impact)'],unbeaten:['🏅','Invaincu'],streak:['📅','Fidèle'],pillar:['🏛️','Pilier'],centurion:['💯','Centurion'],record:['🚀','Record perso'],cool:['🧊','Sang-froid'],magnet:['🧲','Aimant à victoires'],maestro:['🎩','Chef d\'orchestre']};
function badgesForSession(sess){ const key=sess.id+'|'+sigOf(sess); const c0=S._cache.badges[key]; if(c0) return c0; const v=badgesForSessionRaw(sess); S._cache.badges={...S._cache.badges,[key]:v}; return v; }
function badgesForSessionRaw(sess){ const c=S.config; const out=[]; const add=(pid,key,detail)=>out.push({pid,key,icon:BADGES[key][0],label:BADGES[key][1],detail,date:sess.date,sid:sess.id});
  const ss=sessionStats(sess); const rows=Object.values(ss.pl); if(!rows.length) return out;
  rows.forEach(r=>{ if(r.pts>=(c.badgeHot||20)) add(r.id,'hot',r.pts+' pts'); if(r.fg3>=(c.badgeSniper||3)) add(r.id,'sniper',r.fg3+' × 3 pts'); if(r.gp>=(c.badgeUnbeatenMin||4)&&r.w===r.gp) add(r.id,'unbeaten',r.gp+' matchs, 0 défaite'); if((r.ast||0)>=(c.badgeMaestro||5)) add(r.id,'maestro',r.ast+' passes décisives'); });
  { const cand=[]; const mx=cand.length?Math.max(...cand.map(impPerMatch)):0; const walls=cand.filter(r=>impPerMatch(r)===mx); if(walls.length===1) add(walls[0].id,'wall',impLabel(walls[0])+' par match'); }
  // season context up to this session
  const b=seasonBounds(sess.date); const season=Object.values(S.sessions).filter(x=>x.status!=='setup'&&!x.excluded&&x.date>=b.start&&x.date<b.end&&x.date<=sess.date).sort((x,y)=>x.date<y.date?-1:1);
  const idx=season.findIndex(x=>x.id===sess.id); if(idx<0) return out;
  const statsBy=season.map(x=>sessionStats(x).pl);
  rows.forEach(r=>{ const pid=r.id; const played=i=>!!statsBy[i][pid];
    let run=0; for(let i=idx;i>=0;i--){ if(played(i)) run++; else break; }
    if(run===(c.badgePillar||10)) add(pid,'pillar',run+' dimanches d\'affilée'); else if(run===(c.badgeStreak||5)) add(pid,'streak',run+' dimanches d\'affilée');
    let cum=0, before=0; for(let i=0;i<=idx;i++){ if(played(i)){ if(i<idx) before+=statsBy[i][pid].pts; cum+=statsBy[i][pid].pts; } }
    if(before<(c.badgeCenturion||100)&&cum>=(c.badgeCenturion||100)) add(pid,'centurion',cum+' pts cette saison');
    const prev=[]; for(let i=0;i<idx;i++){ if(played(i)) prev.push(statsBy[i][pid].pts); } if(prev.length>=3&&r.pts>Math.max(...prev)) add(pid,'record',r.pts+' pts, ancien record '+Math.max(...prev));
    let clean=0; for(let i=0;i<=idx;i++){ if(played(i)){ const x=statsBy[i][pid]; if(x.tech||x.uns) clean=0; else clean++; } } if(clean===(c.badgeCool||8)) add(pid,'cool',clean+' séances sans technique ni antisportive');
  });
  const tot={}; for(let i=0;i<=idx;i++){ Object.values(statsBy[i]).forEach(x=>{ const t=tot[x.id]||(tot[x.id]={gp:0,w:0}); t.gp+=x.gp; t.w+=x.w; }); }
  const elig=Object.entries(tot).filter(([id,t])=>t.gp>=(c.badgeMagnetMin||30)).map(([id,t])=>({id,p:t.w/t.gp,gp:t.gp,w:t.w})).sort((a,b)=>b.p-a.p);
  if(elig.length&&elig[0].id in ss.pl&&(elig.length===1||elig[0].p>elig[1].p)) add(elig[0].id,'magnet',pct(elig[0].w,elig[0].gp)+' % de victoires sur '+elig[0].gp+' matchs');
  return out; }
function badgesForPlayer(pid){ return Object.values(S.sessions).filter(s=>s.status!=='setup'&&!s.excluded).sort((a,b)=>a.date<b.date?-1:1).flatMap(s=>badgesForSession(s)).filter(b=>b.pid===pid); }

function teamOfDay(sess){ const ss=sessionStats(sess); const tr=teamRank(ss); if(sess.teamsApprox||sess.format==='cent'||tr.length<2||!(tr[0][1].w>0)) return null; if(tr[0][1].w===tr[1][1].w&&(tr[0][1].pf-tr[0][1].pa)===(tr[1][1].pf-tr[1][1].pa)) return null; return tr[0][0]; }

function seasonAwards(){ const b=seasonBounds(); const sess=Object.values(S.sessions).filter(s=>s.status==='closed'&&inStats(s)&&s.date>=b.start&&s.date<b.end).sort((x,y)=>x.date<y.date?-1:1); const n=sess.length; if(!n) return {sess:[],rows:[],list:[]};
  const sig=sess.map(sigOf).join(';')+'|'+Object.keys(S.sanctions).length; if(S._cache.season&&S._cache.season.sig===sig) return S._cache.season.v; const v=seasonAwardsRaw(sess,n); S._cache.season={sig,v}; return v; }
function seasonAwardsRaw(sess,n){ const b=seasonBounds();
  const ag=aggregate(sess); const rows=ag.pl; const ctx={}; rows.forEach(r=>ctx[r.id]=playerContext(sess,r.id));
  const half=Math.floor(n/2); const first=sess.slice(0,half), second=sess.slice(half);

  const list=[];

  list.push({...AWARDS[2],w:pick(r=>r.fg3>0,r=>r.fg3,x=>`${x.r.fg3} paniers à 3 pts`)});
  list.push({...AWARDS[3],w:pick(r=>r.fta>=30,r=>r.ftm/r.fta,x=>`${pct(x.r.ftm,x.r.fta)} % (${x.r.ftm}/${x.r.fta})`)});
  list.push({...AWARDS[4],w:pick(r=>impOk(r,IMP_AWARD)&&impPerMatch(r)>0,r=>impPerMatch(r),x=>`${impLabel(x.r)} pts par 10 min`)});
  list.push({...AWARDS[5],w:pick(r=>true,r=>r.sessions,x=>`${x.r.sessions} dimanches sur ${n}`)});
  list.push({...AWARDS[6],w:pick(r=>r.gp>=60,r=>r.w/r.gp,x=>`${pct(x.r.w,x.r.gp)} % (${x.r.w} V – ${x.r.gp-x.r.w} D)`)});
  if(half>=4){ const a1=aggregate(first).pl, a2=aggregate(second).pl; const m1=Object.fromEntries(a1.map(r=>[r.id,r])), m2=Object.fromEntries(a2.map(r=>[r.id,r])); const cand=rows.filter(r=>m1[r.id]&&m2[r.id]&&m1[r.id].gp>=10&&m2[r.id].gp>=10).map(r=>({r,v:m2[r.id].pts/m2[r.id].gp-m1[r.id].pts/m1[r.id].gp})).sort((a,b)=>b.v-a.v); list.push({...AWARDS[7],w:cand.length&&cand[0].v>0?{pid:cand[0].r.id,value:`${fmt1(m1[cand[0].r.id].pts/m1[cand[0].r.id].gp)} → ${fmt1(m2[cand[0].r.id].pts/m2[cand[0].r.id].gp)} pts/match`,runner:null}:null}); } else list.push({...AWARDS[7],w:null});
  list.push({...AWARDS[8],w:pick(r=>r.sessions>=25&&!r.tech&&!r.uns&&!playerSanctions(r.id,true).length,r=>r.sessions,x=>`${x.r.sessions} dimanches, casier vierge`)});

  const posOf=id=>(S.players[id]||{}).pos||''; const anyPos=rows.some(r=>posOf(r.id));
  if(anyPos){ list.push({...AWARDS[10],w:pick(r=>posOf(r.id)&&posOf(r.id)!=='M'&&(r.ast||0)>=10,r=>r.ast||0,x=>`${x.r.ast} passes décisives (${posLabel(posOf(x.r.id)).toLowerCase()})`)});
    list.push({...AWARDS[11],w:pick(r=>['AF','P'].includes(posOf(r.id))&&r.fg3>0,r=>r.fg3,x=>`${x.r.fg3} paniers à 3 pts (${posLabel(posOf(x.r.id)).toLowerCase()})`)}); }

  { const tc=todCounts(sess); list.push({...AWARDS.find(a=>a.k==='dimanche'),w:pick(r=>(tc[r.id]||0)>0,r=>tc[r.id]+(r.w||0)/1000,x=>`${tc[x.r.id]} fois dans l'équipe du jour sur ${x.r.sessions} dimanche${x.r.sessions>1?'s':''}`)}); }

function monthAwards(){ const b=seasonBounds(); const sess=Object.values(S.sessions).filter(x=>x.status==='closed'&&inStats(x)&&x.date>=b.start&&x.date<b.end); const locks=monthLocks(); const sig=sess.map(sigOf).join(';')+'|'+JSON.stringify(locks); if(S._cache.month&&S._cache.month.sig===sig) return S._cache.month.v;
  const by={}; sess.forEach(x=>{ (by[x.date.slice(0,7)]=by[x.date.slice(0,7)]||[]).push(x); }); const cur=today().slice(0,7);
  const v=Object.keys(by).sort().map(k=>{ const ss=by[k]; const n=ss.length; const done=k<cur; const minS=Math.ceil(n*0.6), minG=Math.min(12,3*n); const rows=aggregate(ss).pl.filter(r=>r.gp>0);
    const elr=rows.filter(r=>r.sessions>=minS&&r.gp>=minG); const N=noteParts(elr,n); const el=elr.map(r=>({r,v:N[r.id].note})).sort((a,c)=>c.v-a.v||c.r.w-a.r.w||c.r.pts/c.r.gp-a.r.pts/a.r.gp);
    const lab=MOIS[+k.slice(5,7)-1]; let win=n>=2&&el[0]?el[0]:null, runner=n>=2&&el[1]?el[1]:null, locked=false;
    const lk=done&&locks[k]; if(lk&&rows.some(r=>r.id===lk)){ locked=true; if(!win||win.r.id!==lk){ const mine=el.find(e=>e.r.id===lk)||(()=>{ const r=rows.find(r=>r.id===lk); return {r,v:noteParts(rows,n)[lk].note}; })(); runner=null; win={...mine,frozen:true}; } }

  S._cache.month={sig,v}; return v; }

function playerContext(sessions,pid){ const c={pts:0,teamPts:0,teamFG:0,ast:0,fg3:0,ftm:0,fta:0,w:0,gp:0,tech:0,uns:0};
  for(const s of sessions){ for(const m of s.matches){ if(m.status!=='done') continue; const side=['home','away'].find(k=>m.roster&&m.roster[k]&&m.roster[k].includes(pid)); let team=side?m[side]:null; if(!team){ team=[m.home,m.away].find(t=>s.teams[t]&&s.teams[t].players.includes(pid)); } if(!team) continue;
      const st=matchState(m,s); const me=st.pl[pid]||{}; c.gp++; if(m.winner===team)c.w++; c.pts+=me.pts||0; const astRec=m.events.some(e=>e.type==='ast'); if(astRec){ c.astG=(c.astG||0)+1; c.ast+=me.ast||0; } c.fg3+=me.fg3||0; c.ftm+=me.ftm||0; c.fta+=me.fta||0; c.tech+=me.tech||0; c.uns+=me.uns||0; c.teamPts+=st.score[team]||0;
      const roster=(m.roster&&m.roster[team===m.home?'home':'away'])||s.teams[team].players; if(astRec) roster.forEach(x=>{ const r=st.pl[x]; if(r) c.teamFG+=(r.fg2||0)+(r.fg3||0); }); } }
  return c; }

function renumberMatches(s){ const done=[...s.matches].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); done.forEach((m,i)=>{ m.n=i+1; }); }
function matchTimeline(s){ const tn=t=>(s.teams[t]&&(s.teams[t].name||TNAMES[t]))||t; return [...s.matches].filter(m=>m.status==='done').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(m=>{ const st=matchState(m,s); const ev=m.events||[]; const start=ev.length?ev[0].t:m.createdAt; const end=m.endedAt||(ev.length?ev[ev.length-1].t:null); return {n:m.n,start,end,home:m.home,away:m.away,hn:tn(m.home),an:tn(m.away),hs:st.score[m.home],as:st.score[m.away],winner:m.winner,wn:tn(m.winner),nEv:ev.length,reason:m.endReason,thin:ev.length<12}; }); }

  return `<div class="card"><h2>Chronologie des matchs</h2><p class="muted small" style="margin:2px 0 8px">${tl.length} match${tl.length>1?'s':''} saisi${tl.length>1?'s':''}${dur?' · '+fmtTime(first.start)+' → '+fmtTime(last.end)+' ('+dur+' min)':''}. Un trou de plus de 5 min entre deux matchs = un match non enregistré.</p><div class="tbl"><table><thead><tr><th>#</th><th>Heure</th><th>Match</th><th class="num">Act.</th></tr></thead><tbody>${tl.map((r,i)=>{ const gap=i?Math.round((r.start-tl[i-1].end)/60000):0; const hw=r.winner===r.home; return `${gap>5?`<tr><td colspan="4" class="small" style="text-align:center;background:color-mix(in srgb,var(--warn) 14%,transparent)">⚠ ${gap} min sans saisie</td></tr>`:''}<tr><td class="num">${r.n}</td><td class="small num" style="white-space:nowrap">${r.start?fmtTime(r.start):'–'}<br><span class="muted">${r.end?fmtTime(r.end):'–'}</span></td><td style="white-space:nowrap">${dot(s.teams,r.home)} <span style="${hw?'font-weight:800':'color:var(--muted)'}">${esc(r.hn)}</span> <b class="num">${r.hs}–${r.as}</b> ${dot(s.teams,r.away)} <span style="${hw?'color:var(--muted)':'font-weight:800'}">${esc(r.an)}</span>${r.reason==='points'?'':' <span class="muted small">⏱</span>'}</td><td class="num ${r.thin?'':'muted'}">${r.nEv}${r.thin?' ⚠':''}</td></tr>`; }).join('')}</tbody></table></div><p class="muted small" style="margin-top:6px">Vainqueur en gras · ⏱ = fini au temps · Act. = actions saisies${tl.some(r=>r.thin)?' (⚠ peu d\'actions : stats incomplètes)':''}.</p></div>`; }

  { const caps=TEAMS.filter(t=>sess.teams[t]&&sess.teams[t].captain&&sess.teams[t].players.length).map(t=>tn(t)+' : '+pname(sess.teams[t].captain)); if(caps.length) L.push('© Capitaines — '+caps.join(' · ')); }

// ---------- demo data (in memory only, never saved) ----------
const DEMO={players:{},sessions:{}};
function buildDemo(){
  const names=['Yannick','Serge','Franck','Patrick','Cédric','Hervé','Landry','Steve','Christian','Rodrigue','Boris','Arnaud','Jean-Marc','Thierry','Éric','Olivier','Didier','Ludovic','Alain','Joël','Fabrice'];
  names.forEach((n,i)=>DEMO.players['d'+i]={id:'d'+i,name:n+' (démo)',member:i<12,active:true});
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  ['2026-09-06','2026-09-13','2026-09-20','2026-09-27'].forEach((date,si)=>{
    const ids=Object.keys(DEMO.players).sort(()=>rnd()-.5).slice(0,21);
    const teams={A:{name:'Orange',players:ids.slice(0,7)},B:{name:'Bleu',players:ids.slice(7,14)},C:{name:'Vert',players:ids.slice(14,21)}};
    const matches=[]; let home='A',away='B',wait='C';
    for(let n=1;n<=12;n++){
      const m={n,home,away,lineup:{[home]:teams[home].players.slice(0,5),[away]:teams[away].players.slice(0,5)},events:[],status:'done',elapsedMs:600000,running:false};
      const sc={[home]:0,[away]:0}; let t=0;
      while(sc[home]<12&&sc[away]<12&&t<40){ t++; const team=rnd()<.5?home:away; const pid=teams[team].players[Math.floor(rnd()*5)]; const r=rnd();
        if(r<.62){ m.events.push({t,type:'pt',team,pid,v:2}); sc[team]+=2; } else if(r<.8){ m.events.push({t,type:'pt',team,pid,v:3}); sc[team]+=3; }
        else if(r<.9){ m.events.push({t,type:'foul',team,pid}); const o=team===home?away:home; const sh=teams[o].players[Math.floor(rnd()*5)]; if(rnd()<.4){ const made=rnd()<.65; m.events.push({t,type:'ft',team:o,pid:sh,made}); if(made)sc[o]++; } }
        else if(r<.93){ m.events.push({t,type:'tech',team,pid}); } else if(r<.95){ m.events.push({t,type:'uns',team,pid}); }
        else { const on=m.lineup[team]; const bench=teams[team].players.filter(p=>!on.includes(p)); if(bench.length){ m.events.push({t,type:'sub',team,out:on[Math.floor(rnd()*5)],in:bench[Math.floor(rnd()*bench.length)]}); } } }
      m.winner = sc[home]>=sc[away]? home: away; m.endReason = sc[home]>=12||sc[away]>=12?'points':'time';
      matches.push(m); const loser=m.winner===home?away:home; home=m.winner; away=wait; wait=loser;
    }
    DEMO.sessions['s'+si]={id:'s'+si,date,teams,matches,status:'closed',createdAt:0};
  });
}
function setDemo(on){ S.demo=on; if(on){ if(!Object.keys(DEMO.players).length) buildDemo(); S._real={players:S.players,sessions:S.sessions,sid:S.sid,sanctions:S.sanctions}; S.players=DEMO.players; S.sessions=DEMO.sessions; S.sanctions={}; S.sid='s3'; S.view='stats'; }
  else { if(S._real){ S.players=S._real.players; S.sessions=S._real.sessions; S.sid=S._real.sid; S.sanctions=S._real.sanctions; } S.view='home'; } render(); }

function podium(rows,valueOf,labelOf){ const top=[...rows].sort((a,b)=>valueOf(b)-valueOf(a)).slice(0,3); if(top.length<2) return ''; const order=[top[1],top[0],top[2]].filter(Boolean); const cls=['p2','p1','p3']; const medal=['🥈','🥇','🥉'];
  return `<div class="podium">${order.map((r,i)=>`<div class="pod ${cls[i]}"><div class="medal">${medal[i]}</div><div class="nm">${esc(pname(r.id))}</div><div class="v num">${valueOf(r)}</div><div class="s">${labelOf(r)}</div></div>`).join('')}</div>`; }
function hbars(rows,valueOf,fmt,n=8){ const top=[...rows].sort((a,b)=>valueOf(b)-valueOf(a)).slice(0,n); const mx=Math.max(1,...top.map(valueOf)); return top.map((r,i)=>`<div class="hbar ${i===0?'top':''}"><span class="nm">${esc(pname(r.id))}</span><span class="tr"><span class="fl" style="width:${Math.max(3,100*valueOf(r)/mx)}%"></span></span><span class="v num">${fmt(r)}</span></div>`).join(''); }
function sparkline(vals){ if(vals.length<2) return ''; const W=300,H=56,P=6; const mx=Math.max(1,...vals); const xs=i=>P+(W-2*P)*i/(vals.length-1); const ys=v=>H-P-(H-2*P)*v/mx; const pts=vals.map((v,i)=>xs(i).toFixed(1)+','+ys(v).toFixed(1)).join(' '); const last=vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Points par séance"><polyline points="${xs(0)},${H-P} ${pts} ${xs(last)},${H-P}" fill="color-mix(in srgb,var(--accent) 14%,transparent)" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xs(last)}" cy="${ys(vals[last])}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/></svg>`; }

function toastAct(msg,label,act,ms){ showToast({msg,act,label},ms||8000); }
function checkResume(s,m){ if(!m||m.status==='done'||s.format==='cent'||m.running||m.stoppedBy!=='target') return; const st=matchState(m,s); const tgt=S.config.target||12; if(st.score[m.home]<tgt&&st.score[m.away]<tgt){ m.stoppedBy='target-undone'; toastAct('Score sous '+tgt+' : le chrono reste en pause','▶ Relancer le chrono','clock-toggle',10000); } }

arde par mois, conservée par le trésorier.</p></div>`:`<div class="card"><h2>Session</h2><button class="btn sm ghost" data-act="lock">Verrouiller</button></div>`}`; }

function captureForms(){ const out={}; document.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>{ if(e.readOnly||e.type==='file'||(S.skipPreserve&&S.skipPreserve.includes(e.id))) return; out[e.id]=e.type==='checkbox'?{c:e.checked}:{v:e.value,s:e.selectionStart,e:e.selectionEnd}; }); const a=document.activeElement; return {out,focus:a&&a.id}; }

function normName(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function playerKeys(p){ return [p.name,p.nick,...(p.aliases||[])].filter(Boolean).map(normName).filter(Boolean); }
function levName(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const m=[]; for(let i=0;i<=a.length;i++) m[i]=[i]; for(let j=1;j<=b.length;j++) m[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
function similarPlayers(name,excludeId){ const n=normName(name); if(!n) return []; const ft=n.split(' ')[0]; return Object.values(S.players).filter(p=>p.id!==excludeId&&p.active!==false).filter(p=>playerKeys(p).some(k=>k===n||k.split(' ')[0]===ft||(n.length>=5&&levName(k,n)<=2))).map(p=>p.id); }
function parsePasteLine(raw){ let x=String(raw).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,' '); x=x.replace(/^\s*[\-•\*>·]+\s*/,'').replace(/^\s*\d{1,2}\s*[\.\)\-:\/]?\s+/,'').replace(/\([^)]*\)/g,' ').replace(/\s*[:\-–—]\s*(pay[ée]|ok|virement|paypal|lydia|esp[eè]ces?|cash|extra|retard\w*|\+1).*$/i,''); return x.replace(/\s+/g,' ').trim(); }
function matchPasteName(name){ const n=normName(name); if(!n) return {kind:'empty'}; const act=Object.values(S.players).filter(p=>p.active!==false);
  const exact=act.filter(p=>playerKeys(p).includes(n)); if(exact.length===1) return {kind:'ok',pid:exact[0].id}; if(exact.length>1) return {kind:'ambiguous',cands:exact.map(p=>p.id)};
  const toks=n.split(' '); const ft=toks[0];
  const byFirst=act.filter(p=>playerKeys(p).some(k=>k.split(' ')[0]===ft)); if(byFirst.length===1) return {kind:'ok',pid:byFirst[0].id,loose:true};
  if(byFirst.length>1){ if(toks[1]){ const ini=toks[1][0]; const c2=byFirst.filter(p=>playerKeys(p).some(k=>{ const t=k.split(' '); return t[0]===ft&&t[1]&&t[1][0]===ini; })); if(c2.length===1) return {kind:'ok',pid:c2[0].id,loose:true}; } return {kind:'ambiguous',cands:byFirst.map(p=>p.id)}; }
  const sub=act.filter(p=>playerKeys(p).some(k=>k.length>=4&&n.length>=4&&(n.includes(k)||k.includes(n)))); if(sub.length===1) return {kind:'ok',pid:sub[0].id,loose:true};
  if(/^(liste|dimanche|samedi|seance|inscri|hoops|basket|present|extra|retard|rdv|rendez|total|merci|bonjour|salut|hello|\d)/.test(n)||/\b(novembre|decembre|janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|\d{1,2}h)\b/.test(n)||toks.length>4) return {kind:'header'};
  return {kind:'unknown',cands:sub.map(p=>p.id)}; }
function parsePasteList(text){ const seen=new Set(); return String(text||'').split(/\r?\n/).map(raw=>({raw:raw.trim(),name:parsePasteLine(raw)})).filter(x=>x.raw).map(x=>{ const r={...x,...matchPasteName(x.name)}; if(r.kind==='ok'){ if(seen.has(r.pid)) r.kind='dup'; seen.add(r.pid); } return r; }); }
function nextSession(){ const nx=S.config.next||{}; const td=today(); const over=dt=>dt===td&&(Object.values(S.sessions).some(x=>x.date===td&&x.status==='closed')||new Date().getHours()>=14); let date=nx.date&&nx.date>=td&&!over(nx.date)?nx.date:null; const manual=!!date; if(!date){ const d=new Date(td+'T12:00:00'); d.setDate(d.getDate()+((7-d.getDay())%7)); if(over(isoLocal(d))) d.setDate(d.getDate()+7); date=isoLocal(d); }
  let status=manual?(nx.status||'ok'):'ok', note=manual?(nx.note||''):''; const di=dayInfo(date); if(!manual&&di&&di.h===0){ status='cancelled'; note=note||'Pas de séance ce dimanche (calendrier du bureau)'; }
  const prep=Object.values(S.sessions).find(x=>x.status==='setup'&&x.date===date); return {date,manual,time:nx.time||'11h – 13h',place:nx.place||'Hoops Factory Aubervilliers',status,note,prep}; }
function closeChecklist(s){ if(!s) return []; const out=[]; const ms=s.matches||[]; const cent=s.format==='cent'; const live=liveMatch(s);
  out.push(live?{warn:true,txt:`${cent?'Quart-temps':'Match'} ${live.n} en cours : terminez-le d'abord`}:{txt:`${ms.length} ${cent?'quart-temps':'match'+(ms.length>1?'s':'')} terminé${ms.length>1?'s':''}`});
  const empty=ms.filter(m=>m.endedAt&&!(m.events||[]).some(e=>e.type==='pt'||e.type==='ft')); if(empty.length) out.push({warn:true,txt:`${empty.length} match${empty.length>1?'s':''} sans aucun panier (${empty.map(m=>'M'+m.n).join(', ')}) : erreur de saisie ? À corriger, sinon les stats sont faussées`});
  if(!cent&&ms.length){ const approx=ms.filter(m=>m.endedAt&&!m.fiveOk&&!(m.events||[]).some(e=>e.type==='out')); if(approx.length) out.push({warn:true,txt:`${approx.length} match${approx.length>1?'s':''} sans 5 majeur ni remplacement (${approx.map(m=>'M'+m.n).join(', ')}) : matchs joués comptés pour toute l'équipe (MJ*)`}); else out.push({txt:'5 majeur ou remplacements renseignés sur chaque match'}); }
  const oi=(s.incidents||[]).filter(i=>i.status==='open'); if(oi.length) out.push({warn:true,txt:`${oi.length} incident${oi.length>1?'s':''} à traiter par le bureau (${oi.map(i=>pshort(i.pid)).join(', ')})`});
  if(S.unlocked&&!S.scorer&&!S.demo){ const payers=feePayers(s); const pd=payDoc(s.date); const unpaid=payers.filter(pid=>!pd.paid[pid]); const decl=payers.filter(pid=>pd.paid[pid]&&pd.paid[pid].status==='declared'); if(unpaid.length||decl.length) out.push({warn:true,txt:`Participations : ${unpaid.length} non réglée${unpaid.length>1?'s':''}${decl.length?', '+decl.length+' déclarée'+(decl.length>1?'s':'')+' à confirmer':''}${unpaid.length?' ('+unpaid.map(pshort).join(', ')+')':''}`,act:'go-pay',lbl:'Tréso'}); else if(payers.length) out.push({txt:`${payers.length} participation${payers.length>1?'s':''} réglée${payers.length>1?'s':''}`}); }
  if(fbMode()) out.push(S.unlocked&&!S.scorer?{txt:'Une sauvegarde JSON de la base sera téléchargée à la clôture'}:{warn:true,txt:'Sauvegarde JSON : à faire par un membre du bureau (Accueil → Sauvegarde JSON)'});
  return out; }

function mySeasonCard(me,season,rows){ const r=rows.find(x=>x.id===me.id); const L=ladderOf([...season].sort((a,b)=>a.date<b.date?-1:1)); const pos=L.list.findIndex(e=>e.r.id===me.id)+1; const e=pos?L.list[pos-1]:null;

function collectifCard(past,season,rows){ if(!rows.length) return ''; const L=ladderOf([...season].sort((a,b)=>a.date<b.date?-1:1)); const medal=['🥇','🥈','🥉'];

  const m={n:s.matches.length+1,home,away,lineup:{[home]:lastFive(home)||s.teams[home].players.slice(0,5),[away]:lastFive(away)||s.teams[away].players.slice(0,5)},roster:{home:[...s.teams[home].players],away:[...s.teams[away].players]},events:[],status:'live',elapsedMs:0,running:false,startedAt:null,createdAt:Date.now()};
  if(s.format==='cent'){ const prev=s.matches.filter(x=>x.status==='done'&&x.quarter); const q=prev.length+1; const cum={[home]:0,[away]:0}; prev.forEach(x=>{ const st=matchState(x,s); cum[x.home]=(cum[x.home]||0)+st.score[x.home]; cum[x.away]=(cum[x.away]||0)+st.score[x.away]; }); const last=prev[prev.length-1]; if(last){ m.lineup={[home]:[...(last.lineup[home]||m.lineup[home])],[away]:[...(last.lineup[away]||m.lineup[away])]}; } m.quarter=q; m.cum=cum; m.foulRule='continuous'; m.target=25*q; }
  s.matches.push(m); saveSession(s,['matches','nextHome','nextAway']); }
function haptic(ms){ try{ if(navigator.vibrate&&S.haptic!==false) navigator.vibrate(ms||25); }catch(e){} }
function addEvent(s,m,e){ e.t=Date.now(); e.el=elapsed(m); m.events.push(e); haptic(e.type==='pt'?30:[20,40,20]);
  if(s.format!=='cent'){ const whistle=['pt','foul','tech','uns','ft','out'].includes(e.type); if(!m.running&&!m.endedAt&&(m.elapsedMs||0)===0&&!['out','sub'].includes(e.type)){ m.running=true; m.startedAt=Date.now(); } else if(m.running&&whistle&&remaining(m)<=60000){ m.elapsedMs=elapsed(m); m.running=false; m.startedAt=null; m.stoppedBy=e.type; } }
  if(s.format!=='cent'&&['pt','foul','uns','tech','out'].includes(e.type)){ const r=remaining(m); if(r>0&&r<=60000) startShot(20); else stopShot(); }

  if(s.format!=='cent'){ const tgt=S.config.target||12; if((st.score[m.home]>=tgt||st.score[m.away]>=tgt)&&m.running){ m.elapsedMs=elapsed(m); m.running=false; m.startedAt=null; m.stoppedBy='target'; stopShot(); } }
  saveSession(s,['matches']);

function endMatch(s,m,winner){ stopShot(); m.status='done'; m.winner=winner; m.running=false; m.elapsedMs=elapsed(m); m.startedAt=null; m.endReason=remaining(m)===0?'time':'points'; m.endedAt=Date.now(); S.sheet=null; saveSession(s,['matches','nextHome','nextAway']); toast('Match '+m.n+' terminé'); }
